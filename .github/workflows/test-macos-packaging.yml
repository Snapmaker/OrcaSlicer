name: Test macOS packaging

on:
  pull_request:
    paths:
      - '.github/workflows/build_orca.yml'
      - '.github/workflows/test-macos-packaging.yml'
      - 'scripts/packaging/create_dmg.py'
      - 'tests/packaging/test_create_dmg.py'

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test DMG capacity and mounted contents
        run: python3 -m unittest discover -s tests/packaging -p test_create_dmg.py -v
