name: Upload Debug Symbols to Sentry

# Reusable workflow: build_deps.yml calls it after build_orca.yml, with `secrets: inherit`.
#
# What it does: installs a pinned, checksum-verified sentry-cli, uploads the build's debug
# symbols (Windows: the PDBs plus EdgeSlicer.exe/.dll and the Sentry/crashpad binaries; macOS:
# the dSYMs), and on release refs creates and finalizes the Sentry release named exactly as the
# app reports it (edgeslicer@<Snapmaker_VERSION>, see src/sentry_wrapper/SentryWrapper.cpp).
#
# What it never does: fail the calling workflow. Without SENTRY_AUTH_TOKEN / SENTRY_ORG /
# SENTRY_PROJECT (forks, pull requests from forks) every step after the check is skipped and the
# job is green with a notice. With them, a Sentry outage turns the upload step red, but the job is
# continue-on-error, so the build's artifacts and status are untouched; the failure is in the log.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
        description: "Runner: windows-2022 or macos-14 (Linux builds carry no crash handler)"
      pdb-artifact-name:
        required: false
        type: string
        default: ''
        description: "Windows: artifact holding the Debug_PDB_*.7z archive (e.g. 'PDB')"
      portable-artifact-name:
        required: false
        type: string
        default: ''
        description: "Windows: artifact holding the portable tree (EdgeSlicer.exe, EdgeSlicer.dll, sentry.dll, crashpad_handler.exe)"
      dsym-artifact-name:
        required: false
        type: string
        default: ''
        description: "macOS: artifact holding the *.dSYM bundles"
      release:
        required: true
        type: string
        description: "Sentry release name, e.g. edgeslicer@2.4.0.0 - must match what the app reports"
      create-release:
        required: false
        type: boolean
        default: false
        description: "Create and finalize the Sentry release (release refs only; symbols are uploaded either way)"

jobs:
  upload_symbols:
    name: Upload Debug Symbols to Sentry
    runs-on: ${{ inputs.os }}
    # Symbol upload is a convenience for crash triage, never a reason to fail a build.
    continue-on-error: true
    env:
      # Pinned. To update: take the version and the per-asset sha256 digests from
      # https://api.github.com/repos/getsentry/sentry-cli/releases/tags/<version>.
      SENTRY_CLI_VERSION: '3.8.0'
      SENTRY_CLI_SHA256_WINDOWS: '2257cf6805a616f5c3ee291a549ebbba021190048b646adc006beb4e8cdef7fd'
      SENTRY_CLI_SHA256_MACOS: '2c26914636c47ab9bf9e710484ad7b44d371cbec8bd29cafb36b3cf877bf4285'
      SENTRY_CLI_SHA256_LINUX: '13f8cb34ae01a6a272d7d7c22e277a105286615b4020de900ea95a8de47cdbb6'
      # sentry-cli reads these three from the environment; they never appear on a command line.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_RELEASE_NAME: ${{ inputs.release }}
    steps:
      - name: Check Sentry configuration
        id: cfg
        shell: bash
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT are not available here (fork or fork PR?) - skipping the symbol upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sentry symbol upload enabled for release ${SENTRY_RELEASE_NAME}"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sentry-cli (pinned, sha256-verified)
        if: steps.cfg.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) asset="sentry-cli-Windows-x86_64.exe"; want="$SENTRY_CLI_SHA256_WINDOWS"; exe="sentry-cli.exe" ;;
            macOS)   asset="sentry-cli-Darwin-universal";   want="$SENTRY_CLI_SHA256_MACOS";   exe="sentry-cli" ;;
            Linux)   asset="sentry-cli-Linux-x86_64";       want="$SENTRY_CLI_SHA256_LINUX";   exe="sentry-cli" ;;
            *) echo "::error::unsupported runner OS $RUNNER_OS"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/sentry-cli"
          mkdir -p "$dir"
          url="https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/${asset}"
          echo "downloading $url"
          curl -fsSL --retry 3 --max-time 300 -o "$dir/$exe" "$url"
          # sha256sum prefixes the whole line with a backslash when the path needs escaping
          # (e.g. a backslash-containing path, as Git Bash on Windows can hand it via
          # $RUNNER_TEMP) - strip that marker, not just take cut's word for the first field.
          got=$( (sha256sum "$dir/$exe" 2>/dev/null || shasum -a 256 "$dir/$exe") | cut -d' ' -f1)
          got="${got#\\}"
          if [ "$got" != "$want" ]; then
            echo "::error::sentry-cli sha256 mismatch (got $got, want $want) - not running it"
            rm -f "$dir/$exe"
            exit 1
          fi
          chmod +x "$dir/$exe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/$exe" --version

      # ==================== Windows ====================
      - name: "[Windows] Download PDB artifact"
        if: steps.cfg.outputs.enabled == 'true' && runner.os == 'Windows' && inputs.pdb-artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.pdb-artifact-name }}
          path: ./symbols/pdb

      - name: "[Windows] Download portable tree"
        if: steps.cfg.outputs.enabled == 'true' && runner.os == 'Windows' && inputs.portable-artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.portable-artifact-name }}
          path: ./symbols/portable

      - name: "[Windows] Collect symbol files"
        if: steps.cfg.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./symbols/upload
          for a in ./symbols/pdb/*.7z; do
            [ -f "$a" ] || continue
            echo "extracting $a"
            7z x "$a" -o"./symbols/upload" -y > /dev/null
          done
          # The PE files carry the unwind tables Sentry needs to walk a minidump's stacks; the
          # PDBs carry names and lines. Only EdgeSlicer's own binaries and the crash handler:
          # third-party DLLs have no symbols to offer.
          for f in EdgeSlicer.exe EdgeSlicer.dll sentry.dll crashpad_handler.exe crashpad_wer.dll; do
            if [ -f "./symbols/portable/$f" ]; then cp "./symbols/portable/$f" ./symbols/upload/; fi
          done
          echo "files to upload:"
          ls -la ./symbols/upload

      # ==================== macOS ====================
      - name: "[macOS] Download dSYM artifact"
        if: steps.cfg.outputs.enabled == 'true' && runner.os == 'macOS' && inputs.dsym-artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dsym-artifact-name }}
          path: ./symbols/upload

      - name: "[macOS] List dSYMs"
        if: steps.cfg.outputs.enabled == 'true' && runner.os == 'macOS'
        shell: bash
        run: find ./symbols/upload -maxdepth 1 -name "*.dSYM" -print || true

      # ==================== all ====================
      - name: Upload symbols and tag the release
        if: steps.cfg.outputs.enabled == 'true'
        # Sentry being down must not cost the build: this step may go red, the job stays green.
        continue-on-error: true
        shell: bash
        env:
          CREATE_RELEASE: ${{ inputs.create-release }}
        run: |
          set -uo pipefail
          status=0
          if [ "$CREATE_RELEASE" = "true" ]; then
            sentry-cli releases new "$SENTRY_RELEASE_NAME" || { echo "::warning::sentry-cli releases new failed"; status=1; }
          fi
          if [ -z "$(ls -A ./symbols/upload 2>/dev/null)" ]; then
            echo "::warning::no symbol files were found to upload"
            status=1
          else
            sentry-cli --log-level=info debug-files upload ./symbols/upload || { echo "::warning::sentry-cli debug-files upload failed - crash reports from this build will not symbolicate until its symbols are uploaded"; status=1; }
          fi
          if [ "$CREATE_RELEASE" = "true" ]; then
            sentry-cli releases finalize "$SENTRY_RELEASE_NAME" || { echo "::warning::sentry-cli releases finalize failed"; status=1; }
          fi
          exit $status
