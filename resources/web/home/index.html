<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Home sections">
    <button class="rail-item" data-section="recent" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L14 10h7V3l-2.64 2.64A8.97 8.97 0 0 0 12 3zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/></svg>
      <span data-i18n="recent">Recent</span>
    </button>
    <button class="rail-item" data-section="library" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H8V4h12z"/></svg>
      <span data-i18n="library">Library</span>
    </button>
    <button class="rail-item" data-section="history" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3zm-3 11H8v-5h8zm3-7a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm-1-9H6v4h12z"/></svg>
      <span data-i18n="history">Print History</span>
    </button>
  </nav>

  <main id="main">
    <header id="bar">
      <h1 id="title"></h1>
      <div id="tools">
        <input id="search" type="search" autocomplete="off" spellcheck="false">
        <select id="sort"></select>
        <button id="refresh" class="icon-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
        </button>
      </div>
    </header>

    <section id="recent" class="section" hidden>
      <div class="actions-row">
        <button id="new-project" class="btn primary" type="button" data-i18n="new_project">New Project</button>
        <button id="open-project" class="btn" type="button" data-i18n="open_project">Open Project</button>
      </div>
      <div class="grid" id="recent-grid"></div>
      <p class="empty" id="recent-empty" hidden></p>
    </section>

    <section id="library" class="section" hidden>
      <div class="lib-top">
        <div id="lib-status" class="status"></div>
        <button id="lib-manage" class="btn" type="button" data-i18n="manage_folders">Manage folders</button>
      </div>
      <div id="lib-offline" class="notice" hidden></div>
      <div id="lib-filters"></div>
      <div class="grid" id="library-grid"></div>
      <div id="lib-more" aria-hidden="true"></div>
      <div class="empty" id="library-empty" hidden>
        <p id="library-empty-text"></p>
        <button id="lib-empty-add" class="btn primary" type="button" data-i18n="add_folder" hidden>Add folder</button>
      </div>
    </section>

    <section id="history" class="section" hidden>
      <div class="notice" id="history-off" hidden>
        <span id="history-off-text"></span>
        <button id="history-settings" class="btn" type="button" data-i18n="open_preferences">Open Preferences</button>
      </div>
      <div class="chips" id="printer-chips"></div>
      <div class="grid" id="history-grid"></div>
      <p class="empty" id="history-empty" hidden></p>
    </section>
  </main>
</div>

<div id="menu" class="menu" hidden role="menu"></div>

<div id="folders" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="folders-title">
    <h2 id="folders-title" data-i18n="folders">Folders</h2>
    <p class="hint" data-i18n="folders_hint">Every model file in these folders shows up in the Library.</p>
    <div id="folder-list"></div>
    <div class="dialog-actions">
      <button id="folder-add" class="btn" type="button" data-i18n="add_folder">Add folder</button>
      <span class="grow"></span>
      <button id="folders-done" class="btn primary" type="button" data-i18n="done">Done</button>
    </div>
  </div>
</div>
<datalist id="dl-category"></datalist>
<datalist id="dl-vendor"></datalist>

<script src="home.js"></script>
</body>
</html>
