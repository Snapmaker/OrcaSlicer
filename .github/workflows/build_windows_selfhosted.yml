# Windows build on the owner's self-hosted runner (devwin11-lance).
#
# Why this exists: the hosted windows-2022 runner in build_all.yml rebuilds the whole
# dependency tree (or restores a multi-GB cache) on every run. The self-hosted VM keeps a
# pre-built dep tree at C:\Dev\EdgeSlicer\deps\build\OrcaSlicer_dep, so a slicer-only build
# is roughly 25 min instead of 90. Artifact names match build_orca.yml's Windows job so the
# release flow can consume either one.
#
# What this workflow deliberately does NOT do: it does not sign, does not deploy to a
# release, and does not build the private network plugins unless they have been staged on
# the runner (see "Detect optional plugin payloads" below). Releases still go through
# build_all.yml plus the owner's local pack step.
#
# Shell note: PowerShell steps spell out their own interpreter rather than using the Actions
# defaults, for two reasons that both come from this VM. PowerShell 7 is not installed, so
# the default `pwsh` fails with "command not found"; and the runner account's execution
# policy is the unconfigured default (Restricted), so Windows PowerShell refuses to dot-source
# the step's temp .ps1 - hence the explicit `-ExecutionPolicy Bypass`, which applies to that
# one process and leaves the machine's policy alone. Relatedly, GITHUB_ENV / GITHUB_OUTPUT
# writes use -Encoding ascii: 5.1's "utf8" emits a BOM, which Actions parses as part of the
# first variable's name.

name: Build Windows (self-hosted)

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: 'Version label for artifact names (blank = read Snapmaker_VERSION from the source)'
        required: false
        type: string
        default: ''
      refresh_deps:
        description: 'Force a dependency rebuild even if the stamp matches'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'ci/**'

# One build at a time. The runner has a single work directory and a single shared dep tree,
# so two concurrent runs would fight over both. Queue rather than cancel: a half-finished
# build cancelled mid-link leaves a confusing tree behind.
concurrency:
  group: build-windows-selfhosted
  cancel-in-progress: false

env:
  # Everything the build shells out to. The runner service account (NETWORK SERVICE) has no
  # user PATH of its own, so each of these has to be spelled out.
  CMAKE_DIR: 'C:\Dev\tools\cmake-3.31.8-windows-x86_64\bin'
  PERL_DIR: 'C:\Dev\tools\strawberry\perl\bin'
  SEVENZIP: 'C:\Program Files\7-Zip\7z.exe'
  VCVARS: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat'
  # The shared, pre-built dependency tree. build_release_vs2022.bat computes
  # DEPS=%CD%/OrcaSlicer_dep after cd-ing into the repo's deps\build, so the workspace's
  # deps\build is made a junction to this path (see "Link the shared deps tree").
  SHARED_DEPS_ROOT: 'C:\Dev\EdgeSlicer\deps\build'
  # Where the owner stages the closed-source payloads. Absent on a clean VM; each is probed
  # for so the same workflow ships them the moment they appear.
  SHIP_ROOT: 'C:\Dev\ship'
  # Opt-in crash reports (docs/privacy.md). The Sentry environment compiled into the app:
  # "release" for the refs shipped builds come from, "ci" otherwise (local builds say "dev").
  # The DSN is handed only to the configure step; without the secret it is empty and the build
  # can never upload anything.
  EDGESLICER_SENTRY_ENVIRONMENT: ${{ (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/ci/') || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main') && 'release' || 'ci' }}
  # sentry-cli for the symbol upload, pinned. To update: version and sha256 digest from
  # https://api.github.com/repos/getsentry/sentry-cli/releases/tags/<version> (same pin as sentry_cli.yml).
  SENTRY_CLI_VERSION: '3.8.0'
  SENTRY_CLI_SHA256_WINDOWS: '2257cf6805a616f5c3ee291a549ebbba021190048b646adc006beb4e8cdef7fd'

jobs:
  build:
    name: Build slicer
    runs-on: [self-hosted, Windows, edgeslicer-build]
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: 'true'
          # A clean tree each run. The build directory lives inside the workspace, so this
          # also guarantees a from-scratch CMake configure rather than a stale cache
          # pointing at a previous run's paths.
          clean: true

      - name: Resolve version
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $label = '${{ inputs.version_label }}'
          if ([string]::IsNullOrWhiteSpace($label)) {
            # Same source of truth as build_orca.yml: the version lives in the header, not version.inc.
            $content = Get-Content src/common_func/common_func.hpp -Raw
            if ($content -match '#define\s+Snapmaker_VERSION\s+"(.*?)"') {
              $verPure = $matches[1]
            } else {
              throw "could not read Snapmaker_VERSION from src/common_func/common_func.hpp"
            }
            $ver = "V$verPure"
          } else {
            $verPure = $label -replace '^[Vv]', ''
            $ver = if ($label -match '^[Vv]') { $label } else { "V$label" }
          }
          "ver=$ver"          | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding ascii
          "ver_pure=$verPure" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding ascii
          Write-Host "version: $ver  (pure: $verPure)"

      - name: Verify toolchain
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            @{ n = 'vcvars64'; p = $env:VCVARS },
            @{ n = 'cmake';    p = (Join-Path $env:CMAKE_DIR 'cmake.exe') },
            @{ n = 'perl';     p = (Join-Path $env:PERL_DIR 'perl.exe') },
            @{ n = '7-Zip';    p = $env:SEVENZIP }
          )
          $missing = @()
          foreach ($r in $required) {
            if (Test-Path -LiteralPath $r.p) { Write-Host ("OK      {0,-10} {1}" -f $r.n, $r.p) }
            else { Write-Host ("MISSING {0,-10} {1}" -f $r.n, $r.p); $missing += $r.n }
          }
          if ($missing.Count) { throw "missing on the runner: $($missing -join ', ')" }
          & (Join-Path $env:CMAKE_DIR 'cmake.exe') --version
          Write-Host "cores: $env:NUMBER_OF_PROCESSORS"

      - name: Install NSIS if missing
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          # NSIS is only needed by cpack. Prefer a system-wide install if the owner has made
          # one; otherwise keep our own copy under C:\Dev\tools, beside the other build tools.
          #
          # It has to go there rather than Program Files: the runner service is NETWORK
          # SERVICE, which is not an administrator, so the installer's default target silently
          # writes nothing and exits 0 (that is exactly what run 34735485636 hit - "installed"
          # with no makensis.exe behind it). C:\Dev\tools is writable by Authenticated Users,
          # and installing a build tool for the build is a smaller thing than granting the
          # service account rights to Program Files.
          $candidates = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe',
            'C:\Dev\tools\nsis\makensis.exe'
          )
          foreach ($c in $candidates) {
            if (Test-Path -LiteralPath $c) {
              Write-Host "NSIS already present at $c"
              & $c /VERSION
              "NSIS_DIR=$(Split-Path -Parent $c)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding ascii
              exit 0
            }
          }

          # Pinned NSIS 3.10, sha256-verified before it is ever executed: a host that serves
          # something else gets skipped rather than run.
          #
          # Fetched with Windows' own curl.exe, and that detail is load-bearing. SourceForge
          # answers Invoke-WebRequest's default agent with a ~140 KB HTML interstitial under
          # HTTP 200 (every mirror, every time - earlier attempts here hashed three different
          # web pages), and answers a browser user-agent string with a Cloudflare JS challenge.
          # curl.exe's own default agent gets the actual binary. The ?viasf=1 keeps the mirror
          # host from bouncing back to the project page.
          $sha256 = '4313D352E0DAFD1F22B6517126A655CAE3B444FA758D2845EDDFBE72F24F7BDD'
          $mirrors = @(
            'https://deac-riga.dl.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10-setup.exe?viasf=1',
            'https://phoenixnap.dl.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10-setup.exe?viasf=1',
            'https://netix.dl.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10-setup.exe?viasf=1'
          )
          $dst = Join-Path $env:RUNNER_TEMP 'nsis-3.10-setup.exe'
          $ok  = $false
          foreach ($url in $mirrors) {
            Write-Host "downloading $url"
            if (Test-Path -LiteralPath $dst) { Remove-Item -LiteralPath $dst -Force }
            & curl.exe -sL --fail --max-time 180 -o $dst $url
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::curl exited $LASTEXITCODE for this mirror - trying the next one"
              continue
            }
            $got = (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash
            if ($got -eq $sha256) { Write-Host "sha256 verified"; $ok = $true; break }
            Write-Host "::warning::sha256 mismatch from this mirror (got $got) - trying the next one"
          }
          if (-not $ok) {
            # Not fatal on its own: the slicer, the tests and the portable zip do not need NSIS.
            # Only the cpack step does, and it is skipped when NSIS_DIR is unset.
            Write-Host "::warning::could not fetch a verified NSIS 3.10 installer - the installer package will be skipped. Install NSIS on the runner to restore it."
            exit 0
          }

          $target = 'C:\Dev\tools\nsis'
          Write-Host "installing silently into $target"
          # /D must be last and unquoted - that is NSIS's own command-line rule.
          $p = Start-Process -FilePath $dst -ArgumentList '/S', "/D=$target" -Wait -PassThru
          $makensis = Join-Path $target 'makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) {
            Write-Host "::warning::NSIS installer exited $($p.ExitCode) but left no makensis.exe in $target - skipping the installer package"
            exit 0
          }
          & $makensis /VERSION
          "NSIS_DIR=$target" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding ascii

      - name: Ensure the runner account can read the shared deps
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:SHARED_DEPS_ROOT
          if (-not (Test-Path -LiteralPath $root)) {
            Write-Host "::warning::$root does not exist yet - the deps step will build it from scratch (~60 min)"
            exit 0
          }
          # The service runs as NETWORK SERVICE. It is an Authenticated User, so the inherited
          # Modify ACE on C:\Dev already covers it - but prove that by actually reading a file
          # rather than trusting the ACL, and grant explicitly if the read fails.
          $probe = Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($probe) {
            try {
              [System.IO.File]::OpenRead($probe.FullName).Dispose()
              Write-Host "read probe OK: $($probe.FullName)"
            } catch {
              Write-Host "read probe FAILED, granting NETWORK SERVICE read access"
              & icacls $root /grant '"NT AUTHORITY\NETWORK SERVICE":(OI)(CI)RX' /T /C | Out-Null
            }
          }
          '{0} contains {1:N1} GB' -f $root, ((Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1GB) | Write-Host

      - name: Decide whether the deps need a refresh
        id: deps
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          # The dep tree was built from some state of deps/. If deps/ has changed since, the
          # pre-built tree is stale and the build would link against the wrong thing (or fail
          # to configure). Compare the current deps/ against a stamp beside the tree.
          #
          # The stamp is `git rev-parse HEAD:deps` - the git TREE OBJECT for deps/, which is a
          # content hash of that directory. Not `git log -1 -- deps`: actions/checkout fetches
          # with --depth=1, so there is no history to walk and that command just answers HEAD,
          # which changes on every commit and would order a 60-minute dep rebuild for a
          # one-line edit somewhere else entirely (it did exactly that on run 34736678876).
          # The tree object needs no history and is identical whenever deps/ is identical.
          $wantStamp  = (git rev-parse 'HEAD:deps').Trim()
          $stampFile  = Join-Path $env:SHARED_DEPS_ROOT '.edgeslicer_deps_stamp'
          $haveStamp  = if (Test-Path -LiteralPath $stampFile) { (Get-Content -LiteralPath $stampFile -Raw).Trim() } else { '' }
          $treeExists = Test-Path -LiteralPath (Join-Path $env:SHARED_DEPS_ROOT 'OrcaSlicer_dep\usr\local')
          $forced     = '${{ inputs.refresh_deps }}' -eq 'true'

          Write-Host "deps/ tree object : $wantStamp"
          Write-Host "stamp on runner   : $(if ($haveStamp) { $haveStamp } else { '<none>' })"
          Write-Host "dep tree present  : $treeExists"
          Write-Host "forced refresh    : $forced"

          # No stamp at all, with a tree already present, is the first-run case on a VM whose
          # deps were built by hand: adopt the current commit rather than burning an hour.
          # Anything else that disagrees means rebuild.
          $refresh = $false
          if (-not $treeExists) {
            $refresh = $true; Write-Host "reason: no dep tree"
          } elseif ($forced) {
            $refresh = $true; Write-Host "reason: refresh_deps input"
          } elseif ($haveStamp -and $haveStamp -ne $wantStamp) {
            $refresh = $true; Write-Host "reason: deps/ changed since the tree was built"
          }

          if (-not $refresh -and -not $haveStamp) {
            Write-Host "adopting the existing hand-built tree for deps/ tree $wantStamp"
            Set-Content -LiteralPath $stampFile -Value $wantStamp -NoNewline -Encoding ascii
          }
          "refresh=$($refresh.ToString().ToLower())" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding ascii
          "want_stamp=$wantStamp"                    | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding ascii

      - name: Link the shared deps tree into the workspace
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          # build_release_vs2022.bat does `cd deps && mkdir build && cd build` and then sets
          # DEPS=%CD%/OrcaSlicer_dep. Making the workspace's deps\build a junction to the shared
          # location means the script's own path arithmetic lands on the pre-built tree, with no
          # patching of the script and no -D override to keep in sync.
          $link = Join-Path $env:GITHUB_WORKSPACE 'deps\build'
          if (Test-Path -LiteralPath $link) {
            $item = Get-Item -LiteralPath $link -Force
            if ($item.LinkType) {
              Write-Host "removing existing link $link -> $($item.Target)"
              [System.IO.Directory]::Delete($link, $false)
            } else {
              Write-Host "removing existing real directory $link"
              Remove-Item -LiteralPath $link -Recurse -Force
            }
          }
          if (-not (Test-Path -LiteralPath $env:SHARED_DEPS_ROOT)) {
            New-Item -ItemType Directory -Path $env:SHARED_DEPS_ROOT -Force | Out-Null
          }
          & cmd /c mklink /J "$link" "$env:SHARED_DEPS_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "mklink /J failed ($LASTEXITCODE)" }
          Write-Host "junction resolves to a usable tree: $(Test-Path -LiteralPath (Join-Path $link 'OrcaSlicer_dep\usr\local'))"

      - name: Build dependencies (only when stale)
        if: steps.deps.outputs.refresh == 'true'
        shell: cmd
        env:
          # The shared dep tree's source checkouts were cloned by the VM's admin account, and the
          # runner is NETWORK SERVICE, so git refuses to work in them ("detected dubious
          # ownership" in dep_Sentry's submodule update, run 35804726225). Trust them for this
          # step's processes only: nothing is written to any git config.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: '*'
        run: |
          call "%VCVARS%" || exit /b 1
          set "PATH=%CMAKE_DIR%;%PERL_DIR%;%PATH%"
          echo Rebuilding the dependency tree - this takes about an hour.
          call build_release_vs2022.bat deps || exit /b 1

      - name: Stamp the rebuilt deps
        if: steps.deps.outputs.refresh == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $stampFile = Join-Path $env:SHARED_DEPS_ROOT '.edgeslicer_deps_stamp'
          Set-Content -LiteralPath $stampFile -Value '${{ steps.deps.outputs.want_stamp }}' -NoNewline -Encoding ascii
          Write-Host "stamped $stampFile"

      - name: Detect optional plugin payloads
        id: ship
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          # The UltraNet / FlashNetwork / ffmpeg binaries are not in this public repo and are
          # not redistributable from it. If the owner has staged them on the VM under
          # C:\Dev\ship\{ultranet,flashnetwork,ffmpeg}, pass the corresponding -D so the same
          # workflow produces a complete package; otherwise build without them and say so.
          $flags = @()
          $probes = @(
            @{ d = 'ultranet';     f = 'bambu_networking.dll'; var = 'ULTRANET_BIN_DIR' },
            @{ d = 'flashnetwork'; f = 'FlashNetwork.dll';     var = 'FLASHNETWORK_BIN_DIR' },
            @{ d = 'ffmpeg';       f = 'ffmpeg.exe';           var = 'FFMPEG_BIN_DIR' }
          )
          foreach ($p in $probes) {
            $dir = Join-Path $env:SHIP_ROOT $p.d
            if (Test-Path -LiteralPath (Join-Path $dir $p.f)) {
              Write-Host "found $($p.f) - shipping via $($p.var)"
              $flags += ('-D{0}={1}' -f $p.var, ($dir -replace '\\', '/'))
            } else {
              Write-Host "::notice::no $($p.f) under $dir - the package will omit that component"
            }
          }
          # FlashNetwork.dll refuses to initialise without FlashForge's server-settings file beside
          # it in the ship folder (2.4.2.0 shipped the DLL alone and the FlashForge tab never
          # started). Say so here; the verify step below fails the run if it is missing.
          $fnDir = Join-Path $env:SHIP_ROOT 'flashnetwork'
          if ((Test-Path -LiteralPath (Join-Path $fnDir 'FlashNetwork.dll')) -and
              -not (Test-Path -LiteralPath (Join-Path $fnDir 'FLASHNETWORK9.DAT'))) {
            Write-Host "::warning::$fnDir has FlashNetwork.dll but no FLASHNETWORK9.DAT - FlashNetwork cannot initialise without it"
          }
          "flags=$($flags -join ' ')" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding ascii

      - name: Configure and build the slicer
        shell: cmd
        env:
          # Compiled in for opt-in crash reports (CMake reads it at configure time).
          EDGESLICER_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          call "%VCVARS%" || exit /b 1
          set "PATH=%CMAKE_DIR%;%PERL_DIR%;%PATH%"
          set "DEPS=%GITHUB_WORKSPACE%\deps\build\OrcaSlicer_dep"
          if not exist "%DEPS%\usr\local" (
            echo ERROR: no dependency tree at %DEPS%
            exit /b 1
          )
          @rem BUILD_TESTS defaults to OFF, so the test targets are not part of ALL_BUILD
          @rem unless it is asked for here. Without it the test step finds no binaries at all
          @rem (run 34736678876) rather than running zero tests loudly.
          @rem vcvars leaves WindowsSDKVersion with a trailing backslash ("10.0.26100.0\"). Inside a
          @rem quoted -D value that backslash escapes the closing quote, and every flag after it
          @rem ended up inside WIN10SDK_PATH - which is how the 2.4.0.0 VM build lost
          @rem ULTRANET/FLASHNETWORK/FFMPEG_BIN_DIR and packaged no plugins. Strip it, and keep the
          @rem payload flags ahead of the SDK path regardless.
          set "SDKVER=%WindowsSDKVersion%"
          if "%SDKVER:~-1%"=="\" set "SDKVER=%SDKVER:~0,-1%"
          if not exist build mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -DBBL_RELEASE_TO_PUBLIC=1 ^
            -DORCA_TOOLS=ON ^
            -DBUILD_TESTS=ON ^
            -DCMAKE_PREFIX_PATH="%DEPS%/usr/local" ^
            -DCMAKE_INSTALL_PREFIX="./EdgeSlicer" ^
            -DCMAKE_BUILD_TYPE=Release ^
            ${{ steps.ship.outputs.flags }} ^
            -DWIN10SDK_PATH="%WindowsSdkDir%Include\%SDKVER%" || exit /b 1
          cmake --build . --config Release --target ALL_BUILD -- -m || exit /b 1

      - name: Compile translations
        shell: cmd
        run: |
          call scripts\run_gettext.bat || exit /b 1

      - name: Run unit tests
        shell: cmd
        working-directory: build
        run: |
          @rem The filter is "~[NotWorking]~[.]" and both halves matter.
          @rem
          @rem ~[NotWorking] drops the three Http tests that reach out to jigsaw.w3.org; that
          @rem host answers 403 now, so they fail on any machine rather than telling us anything.
          @rem
          @rem ~[.] is the half that is easy to get wrong. Catch2 runs hidden ([.]-tagged) tests
          @rem as soon as ANY filter is given, so the obvious "exclude:[NotWorking]" silently
          @rem drags in the demo-exporter cases and a case whose own name ends in "(CURRENT BUG)"
          @rem - five extra failures that have nothing to do with the build. Re-excluding [.]
          @rem keeps a filtered run equivalent to the default one.
          @rem
          @rem What is left is three [!mayfail] cases in libslic3r, which Catch2 counts as
          @rem "failed as expected" and does not fail the run for.
          @rem
          @rem Delayed expansion is on because FAILED is set and read inside the same for body;
          @rem with normal expansion %FAILED% is substituted once, before the loop runs, and a
          @rem failing binary would go unnoticed.
          setlocal ENABLEDELAYEDEXPANSION
          set FAILED=0
          for %%T in (libslic3r slic3rutils fff_print) do (
            echo ============================================================
            echo Running %%T_tests
            echo ============================================================
            if not exist "tests\%%T\Release\%%T_tests.exe" (
              echo ##[error]tests\%%T\Release\%%T_tests.exe was never built
              set FAILED=1
            ) else (
              tests\%%T\Release\%%T_tests.exe "~[NotWorking]~[.]"
              if errorlevel 1 (
                echo ##[error]%%T_tests failed
                set FAILED=1
              )
            )
          )
          if !FAILED! NEQ 0 (
            echo One or more test binaries reported failures.
            exit /b 1
          )
          echo All three test binaries passed.

      - name: Install the portable tree
        shell: cmd
        working-directory: build
        run: |
          call "%VCVARS%" || exit /b 1
          set "PATH=%CMAKE_DIR%;%PATH%"
          cmake --build . --target install --config Release || exit /b 1

      # A payload the probe found must be in the installed tree. The 2.4.0.0 build found all three
      # and packaged none of them (see the WIN10SDK_PATH note above) without anything going red.
      - name: Verify the shipped payloads landed
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SHIP_FLAGS: ${{ steps.ship.outputs.flags }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tree = Join-Path $env:GITHUB_WORKSPACE 'build\EdgeSlicer'
          $expect = @(
            @{ var = 'ULTRANET_BIN_DIR';     path = 'ultranet\bambu_networking.dll' },
            @{ var = 'FLASHNETWORK_BIN_DIR'; path = 'FlashNetwork.dll' },
            # The DLL's server-settings file: without it fnet_initlize fails and the FlashForge
            # tab is dead even though the DLL landed (2.4.2.0).
            @{ var = 'FLASHNETWORK_BIN_DIR'; path = 'resources\data\FLASHNETWORK9.DAT' },
            @{ var = 'FFMPEG_BIN_DIR';       path = 'resources\tools\go2rtc\ffmpeg.exe' }
          )
          $missing = @()
          foreach ($e in $expect) {
            if ($env:SHIP_FLAGS -match $e.var) {
              if (Test-Path -LiteralPath (Join-Path $tree $e.path)) { Write-Host "ok: $($e.path)" }
              else { $missing += $e.path }
            }
          }
          if ($missing.Count -gt 0) { throw "found on the VM but not in the package: $($missing -join ', ')" }

      # ---- Sentry: debug symbols for opt-in crash reports ------------------------------------
      # Skipped (green, with a notice) without the SENTRY_* secrets. A Sentry outage turns the
      # upload step red but never fails the run: continue-on-error, and the packaging steps below
      # do not depend on it.
      - name: Sentry - check configuration
        id: sentry
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:SENTRY_AUTH_TOKEN) -or [string]::IsNullOrEmpty($env:SENTRY_ORG) -or [string]::IsNullOrEmpty($env:SENTRY_PROJECT)) {
            Write-Host "::notice::SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT are not available - skipping the symbol upload."
            "enabled=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding ascii
          } else {
            "enabled=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding ascii
          }
          # Must match what the app reports (src/sentry_wrapper/SentryWrapper.cpp).
          "release=edgeslicer@$($env:ver_pure)" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding ascii
          Write-Host "Sentry release: edgeslicer@$($env:ver_pure), environment: $env:EDGESLICER_SENTRY_ENVIRONMENT"

      - name: Sentry - upload debug symbols
        if: steps.sentry.outputs.enabled == 'true'
        continue-on-error: true
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE_NAME: ${{ steps.sentry.outputs.release }}
          CREATE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/ci/') || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main' }}
        run: |
          # Native tools write progress to stderr; with 'Stop' Windows PowerShell 5.1 would turn
          # that into a terminating error. Exit codes are checked explicitly instead.
          $ErrorActionPreference = 'Continue'

          # sentry-cli: pinned release asset, sha256-verified before it is ever run.
          $dir = Join-Path $env:RUNNER_TEMP 'sentry-cli'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $cli = Join-Path $dir 'sentry-cli.exe'
          $url = "https://github.com/getsentry/sentry-cli/releases/download/$($env:SENTRY_CLI_VERSION)/sentry-cli-Windows-x86_64.exe"
          Write-Host "downloading $url"
          & curl.exe -sL --fail --retry 3 --max-time 300 -o $cli $url
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::could not download sentry-cli (curl $LASTEXITCODE)"; exit 1 }
          $got = (Get-FileHash -LiteralPath $cli -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:SENTRY_CLI_SHA256_WINDOWS) {
            Remove-Item -LiteralPath $cli -Force
            Write-Host "::warning::sentry-cli sha256 mismatch (got $got) - not running it"
            exit 1
          }
          & $cli --version

          # What Sentry needs to symbolicate a minidump from this build: our PE files (unwind
          # tables) and PDBs (names, lines), plus the crash handler's. Nothing third-party.
          $stage = Join-Path $env:RUNNER_TEMP 'sentry-symbols'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $release  = Join-Path $env:GITHUB_WORKSPACE 'build\src\Release'
          $portable = Join-Path $env:GITHUB_WORKSPACE 'build\EdgeSlicer'
          $depsBin  = Join-Path $env:SHARED_DEPS_ROOT 'OrcaSlicer_dep\usr\local\bin'
          $files = @(
            (Join-Path $release 'EdgeSlicer.exe'), (Join-Path $release 'EdgeSlicer.dll'),
            (Join-Path $release 'EdgeSlicer.pdb'), (Join-Path $release 'EdgeSlicer_app.pdb'),
            (Join-Path $portable 'sentry.dll'), (Join-Path $portable 'crashpad_handler.exe'), (Join-Path $portable 'crashpad_wer.dll'),
            (Join-Path $depsBin 'sentry.pdb'), (Join-Path $depsBin 'crashpad_handler.pdb'), (Join-Path $depsBin 'crashpad_wer.pdb')
          )
          foreach ($f in $files) {
            if (Test-Path -LiteralPath $f) { Copy-Item -LiteralPath $f -Destination $stage -Force; Write-Host "staged $f" }
            else { Write-Host "not found: $f" }
          }

          $status = 0
          if ($env:CREATE_RELEASE -eq 'true') {
            & $cli releases new $env:SENTRY_RELEASE_NAME
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::sentry-cli releases new failed"; $status = 1 }
          }
          & $cli --log-level=info debug-files upload $stage
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::sentry-cli debug-files upload failed - crash reports from this build will not symbolicate until its symbols are uploaded"; $status = 1 }
          if ($env:CREATE_RELEASE -eq 'true') {
            & $cli releases finalize $env:SENTRY_RELEASE_NAME
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::sentry-cli releases finalize failed"; $status = 1 }
          }
          exit $status

      # Skipped when the NSIS step could not obtain a verified installer. Everything else
      # (portable zip, tests, sums) still ships, so a SourceForge outage costs the installer
      # rather than the whole build.
      - name: Build the NSIS installer
        if: env.NSIS_DIR != ''
        shell: cmd
        working-directory: build
        run: |
          set "PATH=%CMAKE_DIR%;%NSIS_DIR%;%PATH%"
          cpack -G NSIS || exit /b 1

      - name: Pack the portable zip
        shell: cmd
        working-directory: build
        run: |
          "%SEVENZIP%" a -tzip "EdgeSlicer_Windows_%ver%_portable.zip" "%GITHUB_WORKSPACE%\build\EdgeSlicer" || exit /b 1

      - name: Collect artifacts and checksums
        id: pack
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $out   = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $build = Join-Path $env:GITHUB_WORKSPACE 'build'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          # CPack names the installer from CPACK_PACKAGE_FILE_NAME
          # (EdgeSlicer_Windows_Installer_V<ver>.exe). Keep that name: every published asset
          # is EdgeSlicer_* since the rebrand (release_2380.sh and build_orca.yml agree).
          $installerName = ''
          $installer = Get-ChildItem -LiteralPath $build -Filter '*.exe' -File |
                       Where-Object { $_.Name -match 'Installer' } | Select-Object -First 1
          if ($installer) {
            $installerName = "EdgeSlicer_Windows_Installer_$($env:ver).exe"
            Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $out $installerName) -Force
          } elseif ([string]::IsNullOrEmpty($env:NSIS_DIR)) {
            Write-Host "::warning::no NSIS on the runner, so no installer was built"
          } else {
            throw "NSIS is present but cpack produced no installer .exe in $build"
          }

          $zip = Join-Path $build "EdgeSlicer_Windows_$($env:ver)_portable.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "portable zip missing: $zip" }
          Copy-Item -LiteralPath $zip -Destination $out -Force

          # SHA256SUMS in the usual "<hash>  <name>" shape so `sha256sum -c` works.
          $lines = Get-ChildItem -LiteralPath $out -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS') -Value $lines -Encoding ascii

          Write-Host "--- artifacts ---"
          Get-ChildItem -LiteralPath $out -File | ForEach-Object {
            '{0,-60} {1,10:N1} MB' -f $_.Name, ($_.Length / 1MB) | Write-Host
          }
          Write-Host "--- SHA256SUMS ---"
          Get-Content -LiteralPath (Join-Path $out 'SHA256SUMS') | Write-Host

          "installer_name=$installerName" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding ascii

      - name: Upload installer
        if: steps.pack.outputs.installer_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSlicer_Windows_${{ env.ver }}
          path: artifacts/${{ steps.pack.outputs.installer_name }}
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSlicer_Windows_${{ env.ver }}_portable
          path: artifacts/EdgeSlicer_Windows_${{ env.ver }}_portable.zip
          if-no-files-found: error

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS_Windows_${{ env.ver }}
          path: artifacts/SHA256SUMS
          if-no-files-found: error
