<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge Hub</title>
<meta name="hub-secret" content="__HUB_SECRET__">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #2b2b2b; color: #ddd; font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; font-size: 14px; padding: 20px; }
h1 { font-size: 18px; color: #fff; margin-bottom: 16px; }
.sub { color: #a6a6a6; font-size: 12px; margin-bottom: 16px; }
.row { display: flex; flex-direction: column; gap: 16px; align-items: stretch; max-width: 720px; }
.card.hubcard { max-width: 720px; }
.card { background: #333; border-radius: 8px; padding: 14px 16px; min-width: 280px; }
.card h2 { font-size: 13px; color: #a6a6a6; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
.btn { display: inline-block; padding: 7px 14px; border-radius: 6px; background: #0a7a3e; color: #fff; cursor: pointer; user-select: none; font-size: 13px; margin: 4px 6px 4px 0; }
button.btn { border: 0; font-family: inherit; line-height: normal; }
.btn.dim { background: #555; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.btn.warn { background: #8a3a3a; }
.qr { display: block; margin: 10px 0; background: #fff; border-radius: 6px; }
.url { font-family: Consolas, monospace; font-size: 12px; color: #9ed; word-break: break-all; user-select: all; margin: 6px 0 10px; }
.inst { padding: 8px 10px; border-left: 4px solid #0a9e50; background: #2f2f2f; border-radius: 6px; margin-bottom: 6px; }
.inst .t { font-weight: 600; color: #fff; }
.inst .m { color: #a6a6a6; font-size: 12px; word-break: break-all; }
.note { color: #a6a6a6; font-size: 12px; margin-top: 8px; }
.note.strong { color: #ccc; font-weight: 600; }
.err { color: #e88; }
.adv { margin-top: 10px; }
.adv > summary { color: #a6a6a6; font-size: 12px; cursor: pointer; user-select: none; }
.adv .cmd { font-family: Consolas, monospace; font-size: 12px; color: #d9b; background: #2a2a2a; border-radius: 4px; padding: 6px 8px; margin: 6px 0; word-break: break-all; user-select: all; }
.login { display: flex; justify-content: space-between; align-items: center; background: #2f2f2f; border-radius: 6px; padding: 4px 8px; margin: 3px 0; font-size: 13px; }
.btn.small { padding: 2px 8px; font-size: 12px; margin: 0; }
.addrow { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
.addrow input { flex: 1; min-width: 0; background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 5px 8px; font-size: 13px; }
.dest { padding: 8px 10px; border-left: 4px solid #0a9e50; background: #2f2f2f; border-radius: 6px; margin-bottom: 6px; }
.dest.off { border-left-color: #666; }
.dest.bad { border-left-color: #8a3a3a; }
.dest .t { font-weight: 600; color: #fff; }
.dest .m { color: #a6a6a6; font-size: 12px; word-break: break-all; }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #444; color: #bbb; margin-left: 6px; vertical-align: 1px; }
.badge.ok { background: #17402a; color: #7fd1a0; }
.badge.bad { background: #4a2020; color: #e88; }
.form { background: #2a2a2a; border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
.form label { display: block; color: #a6a6a6; font-size: 12px; margin: 8px 0 2px; }
.form input { width: 100%; background: #222; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 5px 8px; font-size: 13px; }
select { background: #222; color: #ddd; border: 1px solid #555; border-radius: 6px; padding: 3px 6px; font-size: 12px; }
.inline { display: flex; gap: 6px; align-items: center; }
.inline input { flex: 1; min-width: 0; }
.dest .btn.small, .dest select { margin: 8px 6px 0 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid #444; margin-bottom: 10px; }
.tab { padding: 6px 12px; font-size: 13px; color: #a6a6a6; cursor: pointer; user-select: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: #ccc; }
.tab.on { color: #fff; border-bottom-color: #0a9e50; }
.kinds { margin: 8px 0 2px; font-size: 12px; color: #bbb; line-height: 1.9; }
.kinds .lbl { color: #a6a6a6; margin-right: 6px; }
.kinds label { display: inline-block; margin-right: 10px; white-space: nowrap; cursor: pointer; }
.kinds label.off { color: #777; }
.kinds input { vertical-align: -1px; margin-right: 3px; accent-color: #0a9e50; }
.phonerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.phoneicon { width: 22px; height: 22px; color: #0a9e50; flex: none; vertical-align: middle; }
.acts { margin-top: 8px; }
[role="button"]:focus-visible, button:focus-visible, .tab:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #3d8fd6; outline-offset: 2px; }
.tab.on { font-weight: 600; }
@media (prefers-contrast: more) {
    body { color: #f0f0f0; }
    .btn { background: #005f2e; box-shadow: inset 0 0 0 1px #bbb; }
    .btn.dim { background: #666; }
    .sub, .note, .inst .m, .dest .m, .card h2, .form label, .tab, .kinds .lbl, .srcoffer, .adv > summary { color: #d0d0d0; }
    .card { box-shadow: inset 0 0 0 1px #888; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
/* AGPL-3.0 section 13: the source offer every remote user must be able to see. */
.srcoffer { margin: 22px 0 0; color: #a6a6a6; font-size: 11px; max-width: 720px; }
.srcoffer a { color: #8ab; }
</style>
</head>
<body>
<h1>Edge Hub</h1>
<div class="row">
  <div class="card" id="phone"><h2>Home (this network)</h2><div id="phonebody">Loading…</div></div>
  <div class="card" id="remote"><h2>Away (Tailscale)</h2><div id="remotebody">Loading…</div></div>
  <div class="card" id="slicers"><h2>Slicer windows</h2><div id="slicerbody">Loading…</div>
    <div class="acts">
      <span class="btn dim" id="new">Open New Slicer</span>
      <span class="btn dim" id="newhidden">Open Background Slicer</span>
    </div>
  </div>
  <div class="card" id="notify"><h2>Notifications</h2>
    <div class="tabs" id="notifytabs"></div>
    <div id="pushbody">Loading…</div>
    <div id="appbody">Loading…</div>
    <div id="notifybody">Loading…</div>
  </div>
</div>
<div class="hubfoot" style="max-width:720px; margin-top:16px">
  <span class="btn warn" id="quit">Stop Hub Service</span>
  <div class="note" id="status"></div>
</div>
<script src="/hub/qrcode.js"></script>
<script>
(function() {
    var info = null, lastUrl = null;
    // A clickable span is a button for the keyboard and assistive tech too: role, a place in the Tab
    // order, and Enter / Space press it. Every span.btn on this page comes through el().
    function asButton(node) {
        node.setAttribute('role', 'button');
        node.tabIndex = 0;
        node.addEventListener('keydown', function(e) {
            if (e.target !== node || e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); node.click(); }
        });
        return node;
    }
    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        if (tag === 'span' && cls && /(^| )btn( |$)/.test(cls)) asButton(e);
        return e;
    }
    ['new', 'newhidden', 'quit'].forEach(function(id) { var n = document.getElementById(id); if (n) asButton(n); });
    // Every /hub/* call carries the per-run secret the hub wrote into this page (the CSRF guard).
    var SECRET = (document.querySelector('meta[name="hub-secret"]') || {}).content || '';
    function hdrs() { return { 'X-Hub-Secret': SECRET }; }
    function post(path) { return fetch(path, { method: 'POST', headers: hdrs() }).then(function(r) { return r.json(); }); }
    // The QR code is a picture: say what it is, and point at the same thing written out as text.
    function drawQr(canvas, text, what) {
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'QR code for ' + (what || 'this link') + '. The same link is written out as text below it.');
        if (typeof qrcode !== 'function') return false;
        var qr = qrcode(0, 'M'); qr.addData(text); qr.make();
        var n = qr.getModuleCount(), scale = 5, margin = 4 * scale, size = n * scale + 2 * margin;
        canvas.width = canvas.height = size;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size); ctx.fillStyle = '#000';
        for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(margin + c * scale, margin + r * scale, scale, scale);
        return true;
    }
    // A firewall/port warning, one short sentence plus an optional "Show command" toggle that
    // reveals the exact netsh line - same styling as funnelNote's .adv/.cmd below. `command` is
    // omitted (no toggle drawn) when there is nothing to run, e.g. the "could not be checked" note.
    function warningLine(body, text, command) {
        body.appendChild(el('div', 'err', text));
        if (!command) return;
        var d = document.createElement('details'); d.className = 'adv';
        var sum = document.createElement('summary'); sum.textContent = 'Show command';
        d.appendChild(sum);
        var cmd = el('div', 'cmd', command);
        d.appendChild(cmd);
        d.appendChild(copyButton(command));
        body.appendChild(d);
    }
    // A one-line reason the phone might not be able to reach this PC, built from port_note (the
    // hub landed on a port other than 13640 because something else already held it) and
    // lan_firewall (Windows Firewall's view of that port), same idea as videoLine() below but for
    // the LAN listener itself rather than go2rtc's WebRTC one.
    function portWarning(body) {
        var pn = info.port_note, lf = info.lan_firewall;
        if (pn) {
            var heldBy = pn.held_by || 'another program';
            var msg = 'Port ' + pn.default_port + ' is in use by ' + heldBy + '; the phone link uses ' + pn.port + '.';
            // A common holder is an older EdgeSlicer/Snapmaker_Orca hub from a previous install
            // (a leftover data dir the user never fully removed) rather than something unrelated.
            var lower = heldBy.toLowerCase();
            if (lower.indexOf('edgeslicer') !== -1 || lower.indexOf('snapmaker_orca') !== -1)
                msg += ' That looks like another EdgeSlicer install (an older data dir) still running.';
            else
                msg += ' Allow EdgeSlicer.exe through Windows Firewall for this range, or stop the other program.';
            warningLine(body, msg, pn.command);
        }
        if (lf && lf.firewall && lf.firewall !== 'off' && lf.firewall !== 'allowed' && lf.firewall !== 'unknown') {
            warningLine(body, lf.note, lf.command);
        }
    }
    function renderPhone() {
        var body = document.getElementById('phonebody');
        if (!info) return;
        var key = info.url + '|' + JSON.stringify(info.port_note || null) + '|' + (info.lan_firewall ? info.lan_firewall.firewall : '');
        if (key === lastUrl && body.dataset.done) return; // keep the canvas
        lastUrl = key; body.dataset.done = '1';
        body.innerHTML = '';
        if (info.phone && info.url) {
            var canvas = el('canvas', 'qr'); body.appendChild(canvas); drawQr(canvas, info.url, 'the home network phone link');
            body.appendChild(el('div', 'url', info.url));
            body.appendChild(el('div', 'note', 'The fast path: straight to this PC, no internet in the middle. The phone page\'s Connection control switches between this and the Away link, and remembers which one you chose.'));
            portWarning(body);
            var off = el('span', 'btn warn', 'Disable'); off.onclick = function() { post('/hub/phone?on=0').then(refresh); }; body.appendChild(off);
            var relink = el('span', 'btn dim', 'New link');
            relink.onclick = function() {
                if (!confirm('Make a new link?\n\nThis link stops working. Saved links, QR codes and home-screen icons made from it all have to be made again from the new code. Phones paired with the old link also stop getting notifications until they are paired again.')) return;
                post('/hub/newlink').then(refresh);
            };
            body.appendChild(relink);
        } else if (info.phone) {
            body.appendChild(el('div', 'err', 'On, but no network address was found on this PC.'));
            portWarning(body);
            var off2 = el('span', 'btn warn', 'Disable'); off2.onclick = function() { post('/hub/phone?on=0').then(refresh); }; body.appendChild(off2);
        } else {
            body.appendChild(el('div', 'note', 'Anyone with the link can watch the cameras and drive the slicers while it is on.'));
            var on = el('span', 'btn', 'Enable'); on.onclick = function() { post('/hub/phone?on=1').then(refresh); }; body.appendChild(on);
        }
    }
    var lastRemote = null;
    // Camera video goes straight from go2rtc to the phone over WebRTC when it can (Phase 2), which
    // is the one part of the hub that needs an inbound port. We only report what Windows Firewall
    // says - allowing a program is the user's call, and it needs administrator rights.
    function videoLine(body) {
        var v = info.video;
        if (!v) return;
        if (v.webrtc_port && v.firewall === 'allowed') {
            body.appendChild(el('div', 'note', 'Direct video (WebRTC) on UDP/TCP port ' + v.webrtc_port + '; Windows Firewall already allows go2rtc.'));
            return;
        }
        if (v.firewall === 'unknown' || v.firewall === 'off') {
            body.appendChild(el('div', 'note', v.note));
        } else {
            warningLine(body, v.note, v.command);
        }
        if (v.go2rtc_exe) body.appendChild(el('div', 'note', v.go2rtc_exe));
        body.appendChild(el('div', 'note', 'Video still works without it - the phone falls back to the relayed stream through this hub.'));
    }
    // The one place a link is offered for copying. execCommand is the fallback: the hub page is
    // served over plain http on loopback, and navigator.clipboard is only defined in a secure
    // context, so on some browsers it is simply not there.
    function copyButton(text) {
        var b = el('button', 'btn dim small', 'Copy link');
        b.type = 'button';
        var live = el('span', 'sr'); live.setAttribute('role', 'status'); // "Copied" is spoken, not only shown
        b.onclick = function() {
            var done = function() { b.textContent = 'Copied'; live.textContent = 'Link copied'; setTimeout(function() { b.textContent = 'Copy link'; live.textContent = ''; }, 1500); };
            if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, function() {}); return; }
            var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
            ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(ta);
        };
        var wrap = document.createElement('span'); wrap.appendChild(b); wrap.appendChild(live);
        return wrap;
    }
    // Funnel is documented and never automated. It publishes this hub to the entire public
    // internet with nothing but the path token in front of it - a deliberate trade for somebody
    // who cannot put Tailscale on the phone, and not something that should have a button.
    function funnelNote(body, rm) {
        var d = document.createElement('details'); d.className = 'adv';
        var sum = document.createElement('summary'); sum.textContent = 'Advanced: no Tailscale app on the phone (Funnel)';
        d.appendChild(sum);
        d.appendChild(el('div', 'note', 'Tailscale Funnel publishes this hub on the public internet under your tailnet\'s name, so any phone or browser can open it with no Tailscale app at all. The only thing guarding it is then the secret token in the link - there is no tailnet sign-in in front of it any more, and the allow-list below stops applying.'));
        d.appendChild(el('div', 'cmd', rm.funnel_command || 'tailscale funnel --bg --https=443 http://127.0.0.1:13640'));
        d.appendChild(el('div', 'note', 'Not recommended, and EdgeSlicer never runs it for you: run it yourself in a terminal if you accept that trade, and `tailscale funnel --https=443 off` to undo it. Turning remote access off here does not turn Funnel off.'));
        body.appendChild(d);
    }
    function renderRemote() {
        var body = document.getElementById('remotebody');
        if (!info || !info.remote) return;
        var rm = info.remote, key = JSON.stringify(rm) + JSON.stringify(info.video || {});
        if (key === lastRemote && body.dataset.done) return; // keep the canvas
        lastRemote = key; body.dataset.done = '1';
        body.innerHTML = '';
        // One state, one sentence, one link: the hub classifies (RemoteHub.cpp,
        // Testing::classify_remote_access) and this only draws. `access` is always present; the
        // older flat fields are still read below for the parts that are not about the state.
        var ac = rm.access || { state: rm.installed ? 'error' : 'not_installed', message: rm.error || '', action: '', action_url: '' };
        var st = ac.state;
        function retry() { lastRemote = null; post('/hub/remote?refresh=1').then(function(j) { info = j; renderRemote(); }).catch(refresh); }
        function actionButton() {
            if (!ac.action) return;
            if (ac.action_url) {
                var a = document.createElement('a'); a.className = 'btn'; a.textContent = ac.action;
                a.href = ac.action_url; a.target = '_blank'; a.rel = 'noopener noreferrer';
                body.appendChild(a);
            } else {
                var b = el('span', 'btn dim', ac.action); b.onclick = retry; body.appendChild(b);
            }
        }
        if (st === 'not_installed' || st === 'not_signed_in' || st === 'not_running') {
            body.appendChild(el('div', '', 'Tailscale gives your phone a private, encrypted path to this hub from anywhere - no port forwarding, no hosting fees, and the phone\'s Tailscale sign-in is the second factor.'));
            body.appendChild(el('div', st === 'not_installed' ? 'note' : 'err', ac.message));
            if (st === 'not_installed')
                body.appendChild(el('div', 'note', 'Install it on the phone as well, signed in to the same account, then come back here and turn remote access on.'));
            actionButton();
            funnelNote(body, rm);
            videoLine(body);
            return;
        }
        if (st === 'https_off') {
            // The one failure nobody can fix from this PC: it is a tailnet-wide setting, so the
            // button opens the exact admin-console page that has the switch.
            body.appendChild(el('div', 'err', ac.message));
            actionButton();
            var again = el('span', 'btn dim', 'Try again'); again.onclick = retry; body.appendChild(again);
            funnelNote(body, rm);
            videoLine(body);
            return;
        }
        if (st === 'serving' && rm.url) {
            body.appendChild(el('div', 'note', 'Tailscale required on this machine and remote device.'));
            var canvas = el('canvas', 'qr'); body.appendChild(canvas); drawQr(canvas, rm.url, 'the away (Tailscale) phone link');
            body.appendChild(el('div', 'url', rm.url));
            body.appendChild(copyButton(rm.url));
            body.appendChild(el('div', 'note', 'Works from anywhere. Scan the Home code as well: the phone page\'s Connection control hops back to it whenever you are on the home network.'));
        } else {
            body.appendChild(el('div', 'note', 'Tailscale required on this machine and remote device.'));
            body.appendChild(el('div', st === 'error' ? 'err' : 'note', ac.message));
            if (st === 'error') { var r2 = el('span', 'btn dim', 'Try again'); r2.onclick = retry; body.appendChild(r2); }
        }
        body.appendChild(el('div', 'note', 'Allowed Tailscale Users'));
        (rm.allowed_logins || []).forEach(function(l) {
            var row = el('div', 'login');
            row.appendChild(el('span', '', l));
            var x = el('span', 'btn dim small', '✕'); x.title = 'Remove'; x.setAttribute('aria-label', 'Remove ' + l);
            x.onclick = function() { post('/hub/remote?remove=' + encodeURIComponent(l)).then(function(j) { info = j; renderRemote(); }); };
            row.appendChild(x);
            body.appendChild(row);
        });
        var addrow = el('div', 'addrow');
        var inp = el('input'); inp.placeholder = 'someone@example.com'; addrow.appendChild(inp);
        var add = el('span', 'btn dim', 'Add');
        add.onclick = function() { var v = inp.value.trim(); if (v) post('/hub/remote?add=' + encodeURIComponent(v)).then(function(j) { info = j; renderRemote(); }); };
        addrow.appendChild(add);
        body.appendChild(addrow);
        if (rm.last_login) body.appendChild(el('div', 'note', 'Last remote visit: ' + rm.last_login));
        funnelNote(body, rm);
        videoLine(body);
        var tog = el('span', 'btn' + (rm.on ? ' warn' : ''), rm.on ? 'Disable' : 'Enable');
        tog.onclick = function() {
            tog.textContent = rm.on ? 'Disabling…' : 'Enabling… (the first time fetches a certificate, up to a minute)';
            post('/hub/remote?on=' + (rm.on ? '0' : '1')).then(function(j) { info = j; renderRemote(); }).catch(function() { lastRemote = null; refresh(); });
        };
        body.appendChild(tog);
    }
    // ---- Notifications ------------------------------------------------------------------
    // One card, three tabs: the phones that subscribed to Web Push ("Mobile Web", /hub/push),
    // and the two relay services that are offered ("Pushover", "Webhook", /hub/notify). Every
    // call goes to the loopback control plane with the secret. The hub masks each credential it
    // hands back, so a saved topic or key can never be read off this page again - which is also
    // why the ntfy QR code is drawn while you are typing the topic, not afterwards.
    var TAB_KEY = 'snorca.hub.notifyTab', TABS = [['mobile', 'Mobile Web'], ['app', 'Native app'], ['pushover', 'Pushover'], ['webhook', 'Webhook']];
    var TAB_NAMES = TABS.map(function(t) { return t[0]; });
    var tab = 'mobile';
    try { var saved = window.localStorage.getItem(TAB_KEY); if (TAB_NAMES.indexOf(saved) >= 0) tab = saved; } catch (e) {}
    function buildTabs() {
        var strip = document.getElementById('notifytabs');
        strip.innerHTML = '';
        TABS.forEach(function(t) {
            var b = el('div', 'tab' + (tab === t[0] ? ' on' : ''), t[1]);
            asButton(b); b.setAttribute('aria-pressed', tab === t[0] ? 'true' : 'false');
            b.onclick = function() { setTab(t[0]); };
            strip.appendChild(b);
        });
        // Only one tab's body is on screen at a time; they all keep refreshing underneath.
        document.getElementById('pushbody').style.display = tab === 'mobile' ? '' : 'none';
        document.getElementById('appbody').style.display = tab === 'app' ? '' : 'none';
        document.getElementById('notifybody').style.display = (tab === 'mobile' || tab === 'app') ? 'none' : '';
    }
    function setTab(t) {
        if (t === tab) return;
        tab = t;
        try { window.localStorage.setItem(TAB_KEY, t); } catch (e) {}
        openForm = null; lastNotify = null; lastPush = null; lastApp = null;
        buildTabs(); renderPush(); renderApp(); renderNotify();
    }
    var notify = null, lastNotify = null, openForm = null, testNote = {};
    function jfetch(path, method, obj) {
        var opt = { method: method, headers: hdrs() };
        if (obj !== undefined) { opt.headers = { 'X-Hub-Secret': SECRET, 'Content-Type': 'application/json' }; opt.body = JSON.stringify(obj); }
        return fetch(path, opt).then(function(r) { return r.json().then(function(j) { return { status: r.status, j: j }; }, function() { return { status: r.status, j: {} }; }); });
    }
    function randomTopic() {
        var abc = 'abcdefghijkmnpqrstuvwxyz23456789', out = '', a = new Uint8Array(24);
        (window.crypto || window.msCrypto).getRandomValues(a);
        for (var i = 0; i < a.length; i++) out += abc[a[i] % abc.length];
        return out;
    }
    function field(parent, label, value, placeholder) {
        parent.appendChild(el('label', '', label));

        }
        if (h.quota_note) body.appendChild(el('div', 'err', 'Not sent: ' + h.quota_note + (h.quota_note_at ? ' (' + when(h.quota_note_at) + ')' : '')));
        if (h.bug) body.appendChild(el('div', 'err', h.bug));
        if (h.clock_warning) body.appendChild(el('div', 'err', 'This PC\'s clock is ' + Math.abs(h.clock_offset_s) + ' s ' + (h.clock_offset_s > 0 ? 'behind' : 'ahead') + '; pushes still work (the hub corrects for it), but other things may not. Set the time automatically in Windows settings.'));
        if (h.queued) body.appendChild(el('div', 'note strong', h.queued + ' notification' + (h.queued === 1 ? '' : 's') + ' waiting for the push service (tried again for up to 30 minutes).'));
        if (h.last_error && h.last_error_at > (h.last_ok_at || 0)) body.appendChild(el('div', 'err', 'Last error: ' + h.last_error + ' (' + when(h.last_error_at) + ')'));

        var acts = el('div', 'acts');
        var chk = el('span', 'btn dim small', hostedBusy ? 'Checking…' : 'Check now');
        chk.onclick = function() { if (!hostedBusy) hostedCheck(true); };
        acts.appendChild(chk);
        var url = el('span', 'btn dim small', 'Service URL…');
        url.style.marginLeft = '6px';
        url.onclick = function() {
            var v = prompt('Push service URL (https://). Leave empty for the EdgeSlicer service.', h.url || '');
            if (v === null) return;
            jfetch('/hub/apppush/options', 'POST', { hosted: { url: v.trim() } }).then(function(r) {
                if (r.status !== 200) { alert(r.j.error || ('The hub refused that (' + r.status + ').')); return; }
                app = r.j; lastApp = null; hostedChecked = false; renderApp();
            });
        };
        acts.appendChild(url);
        if (quota.limit !== undefined) {
            var forget = el('span', 'btn warn small', 'Forget this hub on the service');
            forget.style.marginLeft = '6px';
            forget.onclick = function() {
                if (!confirm('Ask the push service to delete this hub\'s id and counters? The next push registers it again.')) return;
                jfetch('/hub/apppush/hosted/unregister', 'POST', {}).then(function(r) {
                    var u = (r.j && r.j.unregister) || {};
                    appNote = u.ok ? 'The push service has forgotten this hub.' : ('The push service did not forget this hub: ' + (u.error || ('HTTP ' + (u.status || r.status))) + '.');
                    if (r.status === 200) app = r.j;
                    lastApp = null; renderApp();
                });
            };
            acts.appendChild(forget);
        }
        body.appendChild(acts);
        body.appendChild(el('div', 'note', 'How pushes reach your phone: Apple and Google only take notifications signed with the app publisher\'s key, so this PC hands each one to the EdgeSlicer push service, which signs it and passes it on. '
            + 'The service cannot read what the notification says - it is encrypted on this PC to a key only your phone holds - and it sees only this hub\'s id, the device it goes to and the size. Notifications and device tokens are not stored. '
            + 'The hub id is derived from a key made on this PC; no account, email or name is sent.'));
    }
    function renderApp() {
        var body = document.getElementById('appbody');
        if (!app) return;
        if (tab !== 'app') { body.innerHTML = ''; lastApp = null; return; }
        var devs = app.devices || [];
        if (app.mode === 'hosted' && !hostedChecked) {
            // Once per page load: /healthz always, /v1/quota only once a phone is registered.
            hostedChecked = true;
            hostedCheck(devs.length > 0 || !!(app.hosted && app.hosted.quota_at));
            return;
        }
        var key = JSON.stringify(app) + '|' + appNote + '|' + hostedBusy;
        if (key === lastApp) return;
        lastApp = key;
        body.innerHTML = '';
        renderDelivery(body, devs);
        if (!devs.length) body.appendChild(el('div', 'note', 'No app has registered a device yet.'));
        devs.forEach(function(d) {
            var row = el('div', 'dest' + (d.status === 'failing' ? ' bad' : ''));
            var line = el('div', 'phonerow');
            var left = el('span');
            var icon = el('span'); icon.innerHTML = PHONE_SVG;
            icon.title = (d.os || '') + ' ' + (d.app ? 'app ' + d.app : '');
            left.appendChild(icon);
            left.appendChild(document.createTextNode(' ' + (d.label || (d.platform === 'apns' ? 'iPhone' : 'Android')) + ' '));
            left.appendChild(el('span', 'badge', d.platform === 'apns' ? ('APNs / ' + (d.env || 'production')) : 'FCM'));
            left.appendChild(document.createTextNode(' ' + (d.token || '')));
            left.appendChild(el('span', 'badge' + (d.status === 'failing' ? ' bad' : (d.status === 'ok' ? ' ok' : '')),
                                d.status === 'failing' ? 'failing' : (d.status === 'new' ? 'new' : (d.status === 'retrying' ? 'retrying' : 'on'))));
            line.appendChild(left);
            var del = el('span', 'btn warn small', 'Remove');
            del.onclick = function() {
                if (!confirm('Stop pushing to this device? The app can register again the next time it is opened.')) return;
                jfetch('/hub/apppush?id=' + encodeURIComponent(d.id), 'DELETE').then(function(r) { app = r.j; lastApp = null; renderApp(); });
            };
            line.appendChild(del);
            row.appendChild(line);
            if (d.last_error) row.appendChild(el('div', 'err', 'Last error: ' + d.last_error + (d.failures > 1 ? ' (' + d.failures + ' in a row)' : '')));
            body.appendChild(row);
        });
        body.appendChild(kindsRow(app.events, function(patch, done) {
            jfetch('/hub/apppush/options', 'POST', { events: patch.events }).then(function(r) {
                if (r.status !== 200) { done(r.j.error || ('The hub refused that (' + r.status + ').')); return; }
                app = r.j; lastApp = null; done(); renderApp();
            });
        }));
        var acts = el('div', 'acts');
        var sev = severitySelect(app.min_severity);
        sev.onchange = function() { jfetch('/hub/apppush/options', 'POST', { min_severity: sev.value }).then(function(r) { app = r.j; lastApp = null; renderApp(); }); };
        acts.appendChild(sev);
        var tog = el('span', 'btn dim small', app.enabled ? 'Disable' : 'Enable');
        tog.style.marginLeft = '6px';
        tog.onclick = function() { jfetch('/hub/apppush/options', 'POST', { enabled: !app.enabled }).then(function(r) { app = r.j; lastApp = null; renderApp(); }); };
        acts.appendChild(tog);
        {
            var test = el('span', 'btn dim small', 'Send test notification');
            test.style.marginLeft = '6px';
            test.onclick = function() {
                test.textContent = 'Sending…';
                jfetch('/hub/apppush/test', 'POST', {}).then(function(r) {
                    var res = r.j.results || [];
                    // Naming the host is the point of the per-device result: a BadDeviceToken from
                    // a sandbox build sent to the production host is otherwise indistinguishable
                    // from a bug.
                    appNote = (r.j.ok ? ('Test sent to ' + res.length + ' device(s) via ' + (res[0] && res[0].host || 'the push service') + ', as "' + (r.j.kind || 'finished') + '".')
                                      : ('Test failed: ' + ((res[0] && (res[0].error || ('HTTP ' + res[0].status))) || r.j.error || 'no answer') + '.'))
                              + sendingNote(r.j.kinds);
                    lastApp = null; refreshApp();
                });
            };
            acts.appendChild(test);
        }
        body.appendChild(acts);
        if (appNote) body.appendChild(el('div', 'note', appNote));
        body.appendChild(el('div', 'note', 'Push straight to the companion app, on any network - no Tailscale and no Home Screen install needed.'
            + (app.mode === 'hosted' ? '' : ' With your own keys: set the APNs .p8 path, key id, team id and bundle id (and the Firebase service account for Android) under "apppush" in the hub\'s settings.json; '
            + 'the keys are read from wherever you keep them and are never copied into the data dir.')));
    }
    function refreshApp() {
        return fetch('/hub/apppush', { headers: hdrs() }).then(function(r) { return r.json(); })
            .then(function(j) { app = j; renderApp(); }).catch(function() {});
    }
    function renderSlicers(list) {
        var body = document.getElementById('slicerbody');
        body.innerHTML = '';
        if (!list.length) { body.appendChild(el('div', 'note', 'No slicer window is open.')); return; }
        list.forEach(function(i) {
            var d = el('div', 'inst');
            d.appendChild(el('div', 't', i.index + ' · ' + (i.title || 'Untitled') + (i.hidden ? ' (hidden)' : '') + (i.slicing ? ' (slicing)' : '') + (i.needs_attention ? ' (needs attention)' : '')));
            d.appendChild(el('div', 'm', i.path || 'not saved yet'));
            if (i.needs_attention) d.appendChild(el('div', 'err', 'Needs a person at this PC' + (i.attention_reason ? ': ' + i.attention_reason : '') + '.'));
            var b = el('span', 'btn' + (i.hidden ? '' : ' dim'), i.hidden ? 'Show' : 'Hide');
            b.onclick = function() { post('/hub/instances/' + i.pid + '/window?show=' + (i.hidden ? '1' : '0')).then(refresh); };
            d.appendChild(b);
            if (i.needs_attention) {
                var c = el('span', 'btn dim', 'Dismiss');
                c.onclick = function() { post('/hub/instances/' + i.pid + '/attention/clear').then(refresh); };
                d.appendChild(c);
            }
            var q = el('span', 'btn warn', 'Quit');
            q.onclick = function() {
                if (!confirm('Quit slicer window ' + i.index + '? Unsaved work is saved first.')) return;
                post('/hub/instances/' + i.pid + '/quit').then(function() { setTimeout(refresh, 2000); });
            };
            d.appendChild(q);
            body.appendChild(d);
        });
    }
    function refresh() {
        fetch('/hub/info', { headers: hdrs() }).then(function(r) { return r.json(); }).then(function(j) { info = j; renderPhone(); renderRemote(); document.getElementById('status').textContent = 'Hub pid ' + j.pid + ', port ' + j.port + ', version ' + j.version; }).catch(function() {});
        fetch('/hub/instances', { headers: hdrs() }).then(function(r) { return r.json(); }).then(function(j) { renderSlicers(j.instances || []); }).catch(function() {});
        if (!openForm) refreshNotify(); // never while a form is half typed
        refreshPush();
        refreshApp();
    }
    document.getElementById('new').onclick = function() { post('/hub/new').then(function() { setTimeout(refresh, 3000); }); };
    document.getElementById('newhidden').onclick = function() { post('/hub/new?hidden=1').then(function() { setTimeout(refresh, 3000); }); };
    document.getElementById('quit').onclick = function() {
        if (!confirm('Quit the hub? Phone access and the camera relays stop until a slicer window starts it again.')) return;
        post('/hub/quit').then(function() { document.body.innerHTML = '<h1>Hub stopped</h1><div class="sub">You can close this page.</div>'; });
    };
    buildTabs();
    refresh();
    setInterval(refresh, 3000);
})();
</script>
