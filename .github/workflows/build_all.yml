name: Build all

# The daily schedule moved to nightly.yml, which calls this workflow only when main has changed
# since the last nightly and publishes the result as the `nightly` pre-release (docs/nightly.md).
on:
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false
      force-build:
        description: 'Force full rebuild (bypass dependency cache)'
        type: boolean
        default: false
      version-suffix:
        description: 'Version suffix, e.g. -nightly.20260926+abc1234 (blank = release version; for testing the nightly naming)'
        type: string
        default: ''
      sentry-environment:
        description: 'Sentry environment override (blank = release/ci by ref)'
        type: string
        default: ''

  workflow_call:
    inputs:
      version-suffix:
        description: 'Nightly version suffix, "-nightly.<YYYYMMDD>+<shortsha>"'
        type: string
        default: ''
      sentry-environment:
        description: 'Sentry environment compiled into the app'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  

jobs:
  build_all:
    name: Build All
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deprecate 20.04appimage
          # - os: ubuntu-20.04
          - os: ubuntu-24.04
          - os: windows-2022
          - os: macos-14
            arch: arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      version-suffix: ${{ inputs.version-suffix || '' }}
      sentry-environment: ${{ inputs.sentry-environment || '' }}
    secrets: inherit
  flatpak:
    name: "Flatpak"
    # A Flatpak failure must never cost us the mac/Linux/Windows artifacts. The job is
    # already independent of build_all (no `needs:`), so this only stops a red Flatpak
    # from marking the whole workflow run failed.
    continue-on-error: true
    concurrency:
      group: flatpak-${{ matrix.variant.arch }}-${{ github.ref }}
      cancel-in-progress: false
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
      volumes:
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
        - /opt/ghc:/opt/ghc1
        - /usr/local/share/boost:/usr/local/share/boost1
    strategy:
      # On 2026-09-18 x86_64 died on a flaky 504 and fail-fast killed aarch64 mid-build,
      # even though aarch64 had fetched every source and was already compiling wxWidgets.
      # The per-arch concurrency group below never had a chance to matter. Let each arch
      # finish on its own.
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    env:
      date:
      ver:
      ver_pure:
      EDGESLICER_VERSION_SUFFIX: ${{ inputs.version-suffix || '' }}
    steps:
    - name: "Remove unneeded stuff to free disk space"
      run:
        rm -rf /usr/local/lib/android/* /usr/share/dotnet/* /opt/ghc1/* "/usr/local/share/boost1/*"
    - uses: actions/checkout@v5
    - name: Get the version and date
      run: |
        # The version number moved into src/common_func/common_func.hpp; version.inc now only
        # reads it back, so grepping version.inc yields the literal "${CMAKE_MATCH_1}".
        ver_pure=$(grep -E '^#define[[:space:]]+Snapmaker_VERSION[[:space:]]+"' src/common_func/common_func.hpp | cut -d '"' -f2)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          ver="PR-${{ github.event.number }}"
        else
          # A nightly's suffix goes into the file name too, with '-' for '+'.
          ver=V$ver_pure${EDGESLICER_VERSION_SUFFIX//+/-}
        fi
        if [ -n "$EDGESLICER_VERSION_SUFFIX" ]; then
          # flatpak-builder copies the source tree and passes no environment: CMake reads the
          # suffix from this file instead (see the version-suffix block in CMakeLists.txt).
          printf '%s\n' "$EDGESLICER_VERSION_SUFFIX" > version_suffix.txt
          echo "nightly version: $ver_pure$EDGESLICER_VERSION_SUFFIX (file: $ver)"
        fi
        echo "ver=$ver" >> $GITHUB_ENV
        echo "ver_pure=$ver_pure" >> $GITHUB_ENV
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
      shell: bash
    - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: EdgeSlicer_Linux_flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        manifest-path: scripts/flatpak/io.github.acerage.EdgeSlicer.yml
        cache: true
        arch: ${{ matrix.variant.arch }}
        upload-artifact: false
    - name: Find Flatpak bundle file
      id: find_bundle
      working-directory: ${{ github.workspace }}
      run: |
        BUNDLE_NAME="EdgeSlicer_Linux_flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak"
        # Try multiple possible locations
        if [ -f "$BUNDLE_NAME" ]; then
          BUNDLE_PATH="$(pwd)/$BUNDLE_NAME"
        elif [ -f "/__w/EdgeSlicer/EdgeSlicer/$BUNDLE_NAME" ]; then
          BUNDLE_PATH="/__w/EdgeSlicer/EdgeSlicer/$BUNDLE_NAME"
        else
          # Search in current directory and subdirectories
          FOUND=$(find . -name "$BUNDLE_NAME" -type f | head -1)
          if [ -z "$FOUND" ]; then
            echo "Error: Could not find $BUNDLE_NAME"
            echo "Searching for any .flatpak files:"
            find . -name "*.flatpak" -type f || true
            exit 1
          fi
          # Convert relative path to absolute
          BUNDLE_PATH="$(cd "$(dirname "$FOUND")" && pwd)/$(basename "$FOUND")"
        fi
        echo "path=$BUNDLE_PATH" >> $GITHUB_OUTPUT
        echo "Found bundle at: $BUNDLE_PATH"
        ls -lh "$BUNDLE_PATH" || true
      shell: bash

    - name: Upload artifacts Flatpak
      uses: actions/upload-artifact@v4
      with:
        name: EdgeSlicer_Linux_flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        path: ${{ steps.find_bundle.outputs.path }}
        if-no-files-found: error

    - name: Deploy Flatpak to nightly release
      # Upstream's nightly release id: this fork cannot write to it (Not Found), so run it upstream only.
      if: ${{ github.repository == 'Snapmaker/OrcaSlicer' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') }}
      uses: WebFreak001/deploy-nightly@v3.2.0
      with:
        upload_url: https://uploads.github.com/repos/Snapmaker/OrcaSlicer/releases/169912305/assets{?name,label}
        release_id: 169912305
        asset_path: ${{ steps.find_bundle.outputs.path }}
        asset_name: EdgeSlicer_Linux_flatpak_${{ env.ver }}_${{ matrix.variant.arch }}_Beta.flatpak
        asset_content_type: application/octet-stream
        max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted
