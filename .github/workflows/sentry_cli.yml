name: Upload Debug Symbols to Sentry

# One upload for every platform: sentry-cli's upload-dif is format-agnostic, so
# a single Linux runner ships the Windows PDBs and the macOS dSYMs together
# (Linux builds produce no symbol artifact). Artifact downloads are tolerant -
# whatever symbol artifacts this run produced get uploaded, the rest are
# reported as warnings instead of failing the run.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
        description: "Runner label to run the upload on (e.g. ubuntu-24.04)"
      pdb-artifact-name:
        required: false
        type: string
        description: "Artifact name for the Windows PDB archive (e.g. 'PDB'); empty skips it"
      dsym-artifact-name:
        required: false
        type: string
        description: "Artifact name for the macOS dSYM archive (e.g. 'dSYM_Mac_V1.0.0'); empty skips it"
      release:
        required: false
        type: string
        description: "Release version/tag (informational; upload-dif auto-associates releases)"

jobs:
  upload_symbols:
    name: Upload Debug Symbols to Sentry
    runs-on: ${{ inputs.os }}
    steps:
      - name: Install sentry-cli
        shell: bash
        run: |
          if ! command -v sentry-cli &> /dev/null; then
            echo "Installing sentry-cli via official script..."
            curl -sL https://sentry.io/get-cli/ | bash || true
          fi
          if ! command -v sentry-cli &> /dev/null; then
            echo "Official script failed, trying npm..."
            npm install -g @sentry/cli || true
          fi
          if command -v sentry-cli &> /dev/null; then
            sentry-cli --version
          else
            echo "::error::Failed to install sentry-cli"
            exit 1
          fi

      - name: Download Windows PDB artifact
        id: dl_pdb
        if: inputs.pdb-artifact-name != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.pdb-artifact-name }}
          path: ./symbols/windows

      - name: Download macOS dSYM artifact
        id: dl_dsym
        if: inputs.dsym-artifact-name != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.dsym-artifact-name }}
          path: ./symbols/macos

      - name: Extract archives
        if: steps.dl_pdb.outcome == 'success' || steps.dl_dsym.outcome == 'success'
        shell: bash
        run: |
          # The Windows PDBs ship as a .7z inside the artifact.
          shopt -s nullglob globstar
          for archive in ./symbols/**/*.7z; do
            echo "Extracting $archive ..."
            dir="$(dirname "$archive")/extracted"
            if command -v 7z &> /dev/null; then
              7z x "$archive" -o"$dir" -y
            else
              7zz x "$archive" -o"$dir" -y
            fi
            rm -f "$archive"
          done

      - name: Upload debug symbols to Sentry
        if: steps.dl_pdb.outcome == 'success' || steps.dl_dsym.outcome == 'success'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_LOG_LEVEL: debug
        run: |
          if [ "${{ steps.dl_pdb.outcome }}" = "failure" ]; then
            echo "::warning::PDB artifact '${{ inputs.pdb-artifact-name }}' could not be downloaded; uploading without Windows symbols"
          fi
          if [ "${{ steps.dl_dsym.outcome }}" = "failure" ]; then
            echo "::warning::dSYM artifact '${{ inputs.dsym-artifact-name }}' could not be downloaded; uploading without macOS symbols"
          fi
          pdb_count=$(find ./symbols -name "*.pdb" -type f | wc -l | tr -d ' ')
          dsym_count=$(find ./symbols -name "*.dSYM" -type d | wc -l | tr -d ' ')
          echo "Found $pdb_count PDB file(s) and $dsym_count dSYM bundle(s):"
          find ./symbols -name "*.pdb" -type f -o -name "*.dSYM" -type d
          if [ "$pdb_count" -eq 0 ] && [ "$dsym_count" -eq 0 ]; then
            echo "::error::Symbol artifacts downloaded but contained no PDB or dSYM files"
            find ./symbols | head -40
            exit 1
          fi
          # upload-dif does not support --release; it auto-associates with releases
          sentry-cli --log-level=debug --auth-token "$SENTRY_AUTH_TOKEN" upload-dif \
            --org "${{ secrets.SENTRY_ORG }}" --project "${{ secrets.SENTRY_PROJECT }}" ./symbols

      - name: Nothing to upload
        if: steps.dl_pdb.outcome != 'success' && steps.dl_dsym.outcome != 'success'
        shell: bash
        run: echo "::warning::No symbol artifacts were available in this run; nothing uploaded to Sentry"
