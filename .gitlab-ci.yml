# AI harness review job - runs on a group runner with tag: ai-review.
# Requires masked CI/CD variables (group snapmaker_orca/orca_slicing_algorithm):
#   AI_REVIEW_GITLAB_TOKEN  - THIS group's access token with api scope (Reporter+)
#   AI_REVIEW_LLM_API_KEY   - DeepSeek API key (DEEPSEEK_API_KEY also accepted)
#   DG_CLONE_TOKEN          - dev-guidelines clone token (read_repository only)
#   FEISHU_WEBHOOK_URL      - optional: feishu group bot webhook (card ping)
ai_review:
  tags: [ai-review]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  resource_group: "ai-review-mr-$CI_MERGE_REQUEST_IID"
  allow_failure: true
  timeout: 30m
  variables:
    GIT_STRATEGY: none
    GITLAB_HOST: "gitlab.s.com"
    AI_REVIEW_LLM_BASE_URL: "https://api.deepseek.com"
    AI_REVIEW_MODEL: "deepseek-flash"
    AI_REVIEW_LLM_EFFORT: "high"
    AI_REVIEW_PROJECT_STANDARDS: "projects/snapmaker-orca"
    DG_REF: "project/snapmaker-orca"
    # Per-user Python on the runner box; absolute path is the only form the
    # runner process reliably executes (py launcher cannot see per-user installs).
    PYEXE: "C:/Users/snapmaker/AppData/Local/Programs/Python/Python312/python.exe"
  script:
    - '& $env:PYEXE -m pip install --quiet pyyaml==6.0.3'
    - if (Test-Path dg) { Remove-Item -Recurse -Force dg }
    - git clone --depth 1 --branch $env:DG_REF "http://oauth2:$($env:DG_CLONE_TOKEN)@gitlab.s.com/snapmaker_orca/dev-guidelines.git" dg
    - '& $env:PYEXE dg/scripts/ai_review_gitlab.py'
