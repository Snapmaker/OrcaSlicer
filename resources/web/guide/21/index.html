<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=7200" />
<title>Printer Selection</title>
<link rel="stylesheet" type="text/css" href="../css/common.css" />
<link rel="stylesheet" type="text/css" href="../css/printer_table.css" />
<link rel="stylesheet" type="text/css" href="21.css" />
<link rel="stylesheet" type="text/css" href="../css/dark.css" />
<script type="text/javascript" src="../js/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../js/json2.js"></script>
<script type="text/javascript" src="../../data/text.js"></script>
<script type="text/javascript" src="../js/globalapi.js"></script>
<script type="text/javascript" src="../js/printer_table.js"></script>

</head>
<body class="pt-page" onLoad="OnInit()">
<div id="Title">
	<div class="trans" tid="t10">Printer Selection</div>
</div>
<!-- Filled by PrinterTable (../js/printer_table.js): search, counts, All / Clear all, the table. -->
<div id="PtRoot"></div>
<div id="AcceptArea">
	<div class="GrayBtn trans" id="PreBtn" tid="t8" role="button" tabindex="0" onclick="window.open('../11/index.html','_self')">Back</div>
	<div class="NormalBtn trans" id="AcceptBtn" tid="t9" role="button" tabindex="0" onclick="GotoFilamentPage()">Next</div>
</div>

<div id="NoticeMask"></div>
<div id="NoticeBody" role="alertdialog" aria-labelledby="NoticeText">
	<div id="NoticeBar" class="trans" tid="t18">error</div>
	<div id="NoticeContent">
	<div id="NoticeText" class="trans" tid="t37">At least one printer must be selected.</div>
	<div id="NoticeBtns">
		<div class="SmallBtn trans" tid="t36" role="button" tabindex="0" onClick="ShowNotice(0)">ok</div>
	</div>
	</div>
</div>
</body>
