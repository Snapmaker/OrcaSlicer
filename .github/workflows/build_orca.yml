on:
    workflow_call:
      inputs:
        cache-key:
          required: true
          type: string
        cache-path:
          required: true
          type: string
        os:
          required: true
          type: string
        arch:
          required: false
          type: string
        # Nightly builds (nightly.yml): "-nightly.<YYYYMMDD>+<shortsha>", appended to the version the
        # app shows and reports and to the package file names ('+' becomes '-' there). Empty for
        # every other build.
        version-suffix:
          required: false
          type: string
          default: ''
        # Overrides the Sentry environment compiled into the app ("nightly" for nightly builds).
        sentry-environment:
          required: false
          type: string
          default: ''
      outputs:
        release:
          description: "Release version/tag for the build"
          value: ${{ jobs.build_orca.outputs.release }}
        sentry_release:
          description: "Sentry release name the app reports (edgeslicer@<Snapmaker_VERSION><version-suffix>)"
          value: ${{ jobs.build_orca.outputs.sentry_release }}

jobs:
  build_orca:
    name: Build EdgeSlicer
    runs-on: ${{ inputs.os }}
    outputs:
      release: ${{ steps.set_release.outputs.release || steps.set_release_win.outputs.release }}
      sentry_release: ${{ steps.set_release.outputs.sentry_release || steps.set_release_win.outputs.sentry_release }}
    env:
      date:
      ver:
      ver_pure:
      # Opt-in crash reports (docs/privacy.md): the Sentry environment compiled into the app.
      # "release" for the refs shipped builds come from, "ci" for everything else; local
      # builds say "dev". The DSN itself is only handed to the two build steps below.
      # A caller may name it outright (nightly.yml says "nightly").
      EDGESLICER_SENTRY_ENVIRONMENT: ${{ inputs.sentry-environment != '' && inputs.sentry-environment || ((startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/ci/') || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main') && 'release' || 'ci') }}
      # CMake reads it (see the version-suffix block in CMakeLists.txt); empty = a release version.
      EDGESLICER_VERSION_SUFFIX: ${{ inputs.version-suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version
          
      - name: Get the version and date on Ubuntu and macOS
        if: inputs.os != 'windows-2022'
        run: |
          # The version number moved into src/common_func/common_func.hpp; version.inc now only
          # reads it back, so grepping version.inc yields the literal "${CMAKE_MATCH_1}".
          ver_pure=$(grep -E '^#define[[:space:]]+Snapmaker_VERSION[[:space:]]+"' src/common_func/common_func.hpp | cut -d '"' -f2)
          if [ -z "$ver_pure" ]; then
            echo "Error: could not read Snapmaker_VERSION from src/common_func/common_func.hpp" >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            # A nightly's suffix goes into the file names too, with '-' for '+'.
            ver=V$ver_pure${EDGESLICER_VERSION_SUFFIX//+/-}
          fi
          if [ -n "$EDGESLICER_VERSION_SUFFIX" ]; then
            # Also as a file, for any build step that does not pass the environment on.
            printf '%s\n' "$EDGESLICER_VERSION_SUFFIX" > version_suffix.txt
            echo "nightly version: $ver_pure$EDGESLICER_VERSION_SUFFIX (files: $ver)"
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Get the version and date on Windows
        if: inputs.os == 'windows-2022'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          # See the bash step above: the version number lives in the header now, not version.inc.
          $versionContent = Get-Content src/common_func/common_func.hpp -Raw
          if ($versionContent -match '#define\s+Snapmaker_VERSION\s+"(.*?)"') {
              $verPure = $matches[1]
          } else {
              throw "could not read Snapmaker_VERSION from src/common_func/common_func.hpp"
          }
          $suffix = "$env:EDGESLICER_VERSION_SUFFIX"
          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
          } else {
              # A nightly's suffix goes into the file names too, with '-' for '+'.
              $ver = "V$verPure" + $suffix.Replace('+', '-')
          }
          if ($suffix) {
              Set-Content -LiteralPath version_suffix.txt -Value $suffix -Encoding ascii
              Write-Host "nightly version: $verPure$suffix (files: $ver)"
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "ver_pure=$verPure" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

      - name: Set release output (non-Windows)
        id: set_release
        if: inputs.os != 'windows-2022'
        run: |
          echo "release=$ver" >> $GITHUB_OUTPUT
          echo "sentry_release=edgeslicer@$ver_pure$EDGESLICER_VERSION_SUFFIX" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set release output (Windows)
        id: set_release_win
        if: inputs.os == 'windows-2022'
        run: |
          $release = $env:ver
          Write-Output ("release=$release") | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Output ("sentry_release=edgeslicer@$env:ver_pure$env:EDGESLICER_VERSION_SUFFIX") | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
        shell: pwsh

#   UltraNet: EdgeSlicer's private clean-room Bambu network plug-in, aceRage/ultranet.
#   It is fetched with a read-only deploy key (secret ULTRANET_DEPLOY_KEY), built here, and only the
#   compiled .dll/.dylib/.so + marker travel on: the checkout is moved out of the workspace before
#   anything else runs and deleted after the build, the compiler output never reaches this log (see
#   scripts/build_ultranet_posix.sh and scripts/build_ultranet_windows.ps1), and no step uploads it.
#   Forks, fork PRs and a repository without the secret skip all of this and build exactly as
#   before, with no plug-in. (Releases still ship Windows from the self-hosted VM, which stages its
#   own copy; this hosted build is what the nightly ships.)
      - name: UltraNet - check for the deploy key
        id: ultranet
        shell: bash
        env:
          ULTRANET_DEPLOY_KEY: ${{ secrets.ULTRANET_DEPLOY_KEY }}
        run: |
          if [ -n "$ULTRANET_DEPLOY_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "ULTRANET_DEPLOY_KEY is set: the UltraNet network plug-in will be built and bundled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ULTRANET_DEPLOY_KEY is not set - skipping UltraNet; this package carries no network plug-in (Bambu LAN printing unavailable), exactly as before."
          fi

      - name: UltraNet - fetch (deploy key)
        if: steps.ultranet.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: aceRage/ultranet
          ref: main
          ssh-key: ${{ secrets.ULTRANET_DEPLOY_KEY }}
          persist-credentials: false
          path: .ultranet-src

      - name: UltraNet - build and stage the binaries
        if: inputs.os != 'windows-2022' && steps.ultranet.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ultranet-src"
          OUT="$RUNNER_TEMP/ultranet-bin"
          rm -rf "$SRC" "$OUT"
          # Out of the workspace before anything else can see it.
          mv "$GITHUB_WORKSPACE/.ultranet-src" "$SRC"
          trap 'rm -rf "$SRC" "$RUNNER_TEMP/ultranet-logs"' EXIT
          EDGESLICER_VERSION="$ver_pure$EDGESLICER_VERSION_SUFFIX" ULTRANET_LOG_DIR="$RUNNER_TEMP/ultranet-logs" \
            bash scripts/build_ultranet_posix.sh "$SRC" "$OUT"
          echo "ULTRANET_BIN_DIR=$OUT" >> "$GITHUB_ENV"

#   Mac
      - name: Install tools mac
        if: inputs.os == 'macos-14'
        run: |
          brew install libtool
          brew list
          mkdir -p ${{ github.workspace }}/deps/build

      - name: Free disk space
        if: inputs.os == 'macos-14'
        run: |
          df -hI /dev/disk3s1s1
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -hI /dev/disk3s1s1

      - name: Build slicer mac
        if: inputs.os == 'macos-14'
        working-directory: ${{ github.workspace }}
        env:
          # Compiled in for opt-in crash reports; empty without the secret (forks) = no uploads.
          EDGESLICER_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          ./build_release_macos.sh -s -n -x -a universal -t 10.15 -1

      # The same guard the Windows pipeline has: a plug-in that was built must be in the package.
      - name: UltraNet - verify it is in the app bundle
        if: inputs.os == 'macos-14' && steps.ultranet.outputs.enabled == 'true'
        shell: bash
        run: |
          d="${{ github.workspace }}/build/universal/Snapmaker_Orca/EdgeSlicer.app/Contents/Resources/ultranet"
          for f in libbambu_networking.dylib libBambuSource.dylib ultranet.txt; do
            [ -f "$d/$f" ] || { echo "::error::UltraNet was built but $f is missing from $d"; exit 1; }
          done
          echo "bundled: $(lipo -archs "$d/libbambu_networking.dylib") - $(sed -n 2p "$d/ultranet.txt")"

      # Signing and notarization are opt-in by secrets, not by branch: a fork, a pull request or a
      # checkout of this repository without the Developer ID secrets builds the same unsigned dmg
      # as before, and never fails for a missing secret. Once the secrets exist (docs/RELEASING_MACOS.md)
      # every run signs - the nightly on main, release CI on ci/<version>, release/* branches, tags.
      - name: Check for macOS signing secrets
        id: signing
        if: inputs.os == 'macos-14'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MACOS_CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_DEV_ACCOUNT: ${{ secrets.APPLE_DEV_ACCOUNT }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PWD: ${{ secrets.APP_PWD }}
        run: |
          sign=false
          notarize=none
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$MACOS_CERTIFICATE_ID" ]; then
            sign=true
            if [ -n "$APP_STORE_CONNECT_KEY_P8" ] && [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
              notarize=api-key
            elif [ -n "$APPLE_DEV_ACCOUNT" ] && [ -n "$TEAM_ID" ] && [ -n "$APP_PWD" ]; then
              notarize=apple-id
            else
              echo "::warning::Developer ID secrets are set but no notarization credentials (APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID / APP_STORE_CONNECT_KEY_P8): the dmg will be signed but not notarized, and Gatekeeper will still refuse it."
            fi
          else
            echo "::notice::No macOS signing secrets (BUILD_CERTIFICATE_BASE64, P12_PASSWORD, MACOS_CERTIFICATE_ID) - building an unsigned dmg. See docs/RELEASING_MACOS.md."
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          echo "sign=$sign notarize=$notarize"

      - name: Import Developer ID certificate
        if: inputs.os == 'macos-14' && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # The keychain is created and thrown away inside this job, so its password only has to
          # exist; generate one when the optional secret is not set.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 24)}"
          # Whitespace-tolerant decode: the owner pastes the base64 from PowerShell, which wraps it.
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          # Apple's Developer ID intermediates, in case the .p12 was exported without its chain
          # (codesign then fails with "unable to build chain to self-signed root"). Best effort.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            if curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"; then
              security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
              rm -f "$RUNNER_TEMP/$ca.cer"
            fi
          done
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain || security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          echo "Code-signing identities in the build keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          identities=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          if ! echo "$identities" | grep -qF "$MACOS_CERTIFICATE_ID"; then
            if echo "$identities" | grep -qE "Apple Distribution|Apple Development|iPhone Distribution|iPhone Developer|Mac Developer|3rd Party Mac Developer"; then
              echo "::error::The imported .p12 holds an App Store / development certificate ($(echo "$identities" | grep -oE '"[^"]+"' | head -1)), not a 'Developer ID Application' one. Gatekeeper and the notary service only accept Developer ID: create that certificate in the developer portal (docs/RELEASING_MACOS.md, step 1), export it as .p12 and replace BUILD_CERTIFICATE_BASE64 / P12_PASSWORD."
            else
              echo "::error::MACOS_CERTIFICATE_ID does not match any identity in the imported .p12 - it must be the full string, e.g. 'Developer ID Application: Name (TEAMID)', from 'security find-identity -v -p codesigning'."
            fi
            exit 1
          fi
          # codesign wants the identity NAME (or its SHA-1) exactly; the secret only has to
          # select it. Pasting the whole find-identity line (hash + quoted name) into
          # MACOS_CERTIFICATE_ID passes the substring check above but codesign then reports
          # "no identity found" (run 35411024201). Resolve the name from the keychain instead.
          SIGN_IDENTITY=$(echo "$identities" | grep -F "$MACOS_CERTIFICATE_ID" | grep -oE '"Developer ID Application: [^"]+"' | head -1 | tr -d '"')
          if [ -z "$SIGN_IDENTITY" ]; then
            SIGN_IDENTITY=$(echo "$identities" | grep -oE '"Developer ID Application: [^"]+"' | head -1 | tr -d '"')
          fi
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported .p12"
            exit 1
          fi
          echo "signing identity: $SIGN_IDENTITY"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign app bundles (Developer ID, hardened runtime)
        if: inputs.os == 'macos-14' && steps.signing.outputs.sign == 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          MACOS_CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
        run: |
          APP_DIR="${{ github.workspace }}/build/universal/Snapmaker_Orca"
          # Inside out: every nested Mach-O (crashpad_handler, libsentry.dylib, anything a later build
          # adds) with the hardened runtime and a secure timestamp, then the bundle with the entitlements.
          scripts/macos_sign_app.sh "$APP_DIR/EdgeSlicer.app" "$SIGN_IDENTITY" scripts/disable_validation.entitlements
          if [ -f "$APP_DIR/Snapmaker_Orca_profile_validator.app/Contents/MacOS/Snapmaker_Orca_profile_validator" ]; then
            scripts/macos_sign_app.sh "$APP_DIR/Snapmaker_Orca_profile_validator.app" "$SIGN_IDENTITY" scripts/disable_validation.entitlements
          fi

      # The app is notarized and stapled on its own before it goes into the dmg, so the copy a user
      # drags to /Applications carries its ticket too and opens offline; the dmg gets its own below.
      - name: Create DMG
        if: inputs.os == 'macos-14'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          # hdiutil on hosted macOS runners intermittently fails with "Resource busy" (a scanner or
          # diskimages-helper still holding the source); retry a few times before giving up.
          hdiutil_create() {
            for i in 1 2 3 4 5; do
              hdiutil create "$@" && return 0
              echo "hdiutil create failed (attempt $i), retrying in $((i * 10)) s"; sleep $((i * 10))
            done
            return 1
          }
          mkdir -p ${{ github.workspace }}/build/universal/Snapmaker_Orca_dmg
          rm -rf ${{ github.workspace }}/build/universal/Snapmaker_Orca_dmg/*
          cp -R "${{ github.workspace }}/build/universal/Snapmaker_Orca/EdgeSlicer.app" "${{ github.workspace }}/build/universal/Snapmaker_Orca_dmg/"
          ln -sfn /Applications ${{ github.workspace }}/build/universal/Snapmaker_Orca_dmg/Applications
          hdiutil_create -volname "EdgeSlicer" -srcfolder ${{ github.workspace }}/build/universal/Snapmaker_Orca_dmg -ov -format UDZO "${{ github.workspace }}/EdgeSlicer_Mac_universal_${{ env.ver }}.dmg"

          # Create separate Snapmaker_Orca_profile_validator DMG if the app exists
          if [ -f "${{ github.workspace }}/build/universal/Snapmaker_Orca/Snapmaker_Orca_profile_validator.app/Contents/MacOS/Snapmaker_Orca_profile_validator" ]; then
            mkdir -p ${{ github.workspace }}/build/universal/Snapmaker_Orca_profile_validator_dmg
            rm -rf ${{ github.workspace }}/build/universal/Snapmaker_Orca_profile_validator_dmg/*
            cp -R ${{ github.workspace }}/build/universal/Snapmaker_Orca/Snapmaker_Orca_profile_validator.app ${{ github.workspace }}/build/universal/Snapmaker_Orca_profile_validator_dmg/
            ln -sfn /Applications ${{ github.workspace }}/build/universal/Snapmaker_Orca_profile_validator_dmg/Applications
            hdiutil_create -volname "EdgeSlicer Profile Validator" -srcfolder ${{ github.workspace }}/build/universal/Snapmaker_Orca_profile_validator_dmg -ov -format UDZO "${{ github.workspace }}/EdgeSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg"
          fi

      # The dmg is signed and stapled in place, so the artifact uploaded below is the notarized file.
      - name: Sign and notarize DMG
        if: inputs.os == 'macos-14' && steps.signing.outputs.sign == 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          MACOS_CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_DEV_ACCOUNT: ${{ secrets.APPLE_DEV_ACCOUNT }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PWD: ${{ secrets.APP_PWD }}
        run: |
          for dmg in "${{ github.workspace }}/EdgeSlicer_Mac_universal_${{ env.ver }}.dmg" \
                     "${{ github.workspace }}/EdgeSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg"; do
            [ -f "$dmg" ] || continue
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$dmg"
            codesign --verify --verbose=2 "$dmg"
            # ONE notarization submission per run: the dmg. Its ticket covers the app inside
            # (Apple records every nested code hash), and each submission waits on Apple's
            # queue in turn - notarizing the app zip first, then the dmg, then the validator
            # dmg took the run past its time budget on 2026-09-19. The profile validator dmg
            # is a developer tool and is signed but not notarized.
            if [ "$NOTARIZE" != "none" ] && [[ "$(basename "$dmg")" == EdgeSlicer_Mac_universal_* ]]; then
              rc=0; scripts/macos_notarize.sh "$dmg" || rc=$?
              if [ "$rc" = 2 ]; then
                # Still in Apple's queue after the wait: ship the SIGNED dmg anyway. It is not
                # stapled, but the ticket is served online once Apple accepts the submission
                # (id printed above; check with the "Notary status" workflow), so the file
                # becomes Gatekeeper-clean retroactively without a rebuild.
                echo "::warning::$(basename "$dmg") is signed but its notarization is still pending - uploaded unstapled"
              elif [ "$rc" != 0 ]; then
                exit "$rc"
              else
                spctl -a -vv -t open --context context:primary-signature "$dmg" || echo "::warning::spctl did not accept $(basename "$dmg") on the runner (informational; stapler validate above passed)"
              fi
            fi
          done

      - name: Remove signing keychain
        if: always() && inputs.os == 'macos-14' && steps.signing.outputs.sign == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/notary_*.json "$RUNNER_TEMP"/*.zip

      - name: Upload artifacts mac
        if: inputs.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSlicer_Mac_universal_${{ env.ver }}
          path: ${{ github.workspace }}/EdgeSlicer_Mac_universal_${{ env.ver }}.dmg

      - name: Upload Snapmaker_Orca_profile_validator DMG mac
        if: inputs.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSlicer_profile_validator_Mac_universal_DMG_${{ env.ver }}
          path: ${{ github.workspace }}/EdgeSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg
          if-no-files-found: ignore

      - name: Upload dSYM artifacts mac
        if: inputs.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: dSYM_Mac_${{ env.ver }}
          path: ${{ github.workspace }}/build/universal/Snapmaker_Orca/dSYM
          if-no-files-found: warn

      - name: Deploy Mac release
        # The upload_url/release_id below are upstream Snapmaker/OrcaSlicer's nightly release;
        # this fork has no equivalent and no write access to it, so skip cleanly here rather
        # than fail with "Not Found" on every main build.
        if: github.repository == 'Snapmaker/OrcaSlicer' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') && inputs.os == 'macos-14'
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/Snapmaker/OrcaSlicer/releases/169912305/assets{?name,label}
          release_id: 169912305
          asset_path: ${{ github.workspace }}/EdgeSlicer_Mac_universal_${{ env.ver }}.dmg
          asset_name: EdgeSlicer_Mac_universal_${{ env.ver }}.dmg
          asset_content_type: application/octet-stream
          max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted

      - name: Check if profile validator DMG exists
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') && inputs.os == 'macos-14'
        id: check_dmg
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f "EdgeSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "DMG file found, will deploy"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "DMG file not found, skipping deployment"
          fi
        shell: bash

      - name: Deploy Mac Snapmaker_Orca_profile_validator DMG release
        if: github.repository == 'Snapmaker/OrcaSlicer' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') && inputs.os == 'macos-14' && steps.check_dmg.outputs.exists == 'true'
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/Snapmaker/OrcaSlicer/releases/169912305/assets{?name,label}
          release_id: 169912305
          asset_path: ${{ github.workspace }}/EdgeSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg
          asset_name: EdgeSlicer_profile_validator_Mac_universal_nightly.dmg
          asset_content_type: application/octet-stream
          max_releases: 1

# Windows
      - name: setup MSVC
        if: inputs.os == 'windows-2022'
        uses: microsoft/setup-msbuild@v2

      - name: Install nsis
        if: inputs.os == 'windows-2022'
        run: |
          dir "C:/Program Files (x86)/Windows Kits/10/Include"
          choco install nsis

      # The Windows counterpart of "UltraNet - build and stage the binaries" above: same rules (the
      # checkout leaves the workspace first and is deleted afterwards, the compiler output stays in a
      # log that is deleted too), built with this job's MSVC against this job's deps prefix.
      - name: UltraNet - build and stage the binaries (Windows)
        if: inputs.os == 'windows-2022' && steps.ultranet.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src  = Join-Path $env:RUNNER_TEMP 'ultranet-src'
          $out  = Join-Path $env:RUNNER_TEMP 'ultranet-bin'
          $logs = Join-Path $env:RUNNER_TEMP 'ultranet-logs'
          foreach ($d in $src, $out, $logs) { if (Test-Path -LiteralPath $d) { Remove-Item -LiteralPath $d -Recurse -Force } }
          # Out of the workspace before anything else can see it.
          Move-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.ultranet-src') -Destination $src
          try {
            $env:EDGESLICER_VERSION   = "$env:ver_pure$env:EDGESLICER_VERSION_SUFFIX"
            $env:ULTRANET_LOG_DIR     = $logs
            $env:ULTRANET_DEPS_PREFIX = Join-Path $env:GITHUB_WORKSPACE 'deps/build/OrcaSlicer_dep/usr/local'
            & pwsh -NoProfile -File scripts/build_ultranet_windows.ps1 $src $out
            if ($LASTEXITCODE -ne 0) { throw "UltraNet build failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item -LiteralPath $src, $logs -Recurse -Force -ErrorAction SilentlyContinue
          }
          # Forward slashes: the value ends up inside a quoted -D on a cmd command line.
          "ULTRANET_BIN_DIR=$($out -replace '\\', '/')" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build slicer Win
        if: inputs.os == 'windows-2022'
        working-directory: ${{ github.workspace }}
        env:
          WindowsSdkDir: 'C:\Program Files (x86)\Windows Kits\10\'
          WindowsSDKVersion: '10.0.26100.0\'
          # Compiled in for opt-in crash reports; empty without the secret (forks) = no uploads.
          EDGESLICER_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: .\build_release_vs2022.bat slicer

      # A plug-in that was built must be in the package (the check the VM pipeline has).
      - name: UltraNet - verify it is in the Windows package
        if: inputs.os == 'windows-2022' && steps.ultranet.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $d = Join-Path "${{ github.workspace }}" 'build/Snapmaker_Orca/ultranet'
          foreach ($f in 'bambu_networking.dll', 'BambuSource.dll', 'ultranet.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $d $f))) { Write-Host "::error::UltraNet was built but $f is missing from $d"; exit 1 }
          }
          Write-Host "bundled: $((Get-Content -LiteralPath (Join-Path $d 'ultranet.txt'))[1])"

      - name: Create installer Win
        if: inputs.os == 'windows-2022'
        working-directory: ${{ github.workspace }}/build
        run: |
          cpack -G NSIS

      - name: Pack app
        if: inputs.os == 'windows-2022'
        working-directory: ${{ github.workspace }}/build
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip EdgeSlicer_Windows_${{ env.ver }}_portable.zip ${{ github.workspace }}/build/Snapmaker_Orca'

      # The crash handler's own symbols come from the deps tree; next to ours they let Sentry
      # walk frames that pass through sentry.dll.
      - name: Add Sentry/crashpad PDBs
        if: inputs.os == 'windows-2022'
        shell: pwsh
        run: |
          $bin = Join-Path "${{ github.workspace }}" 'deps/build/OrcaSlicer_dep/usr/local/bin'
          foreach ($f in 'sentry.pdb', 'crashpad_handler.pdb', 'crashpad_wer.pdb') {
            $src = Join-Path $bin $f
            if (Test-Path -LiteralPath $src) { Copy-Item -LiteralPath $src -Destination "${{ github.workspace }}/build/src/Release/" -Force }
            else { Write-Host "no $f in the deps tree" }
          }

      - name: Pack PDB
        if: inputs.os == 'windows-2022'
        working-directory: ${{ github.workspace }}/build/src/Release
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Debug_PDB_${{ env.ver }}_for_developers_only.7z  *.pdb'

      - name: Upload artifacts Win zip
        if: inputs.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSlicer_Windows_${{ env.ver }}_portable
          path: ${{ github.workspace }}/build/Snapmaker_Orca

      - name: Upload artifacts Win installer
        if: inputs.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSlicer_Windows_${{ env.ver }}
          path: ${{ github.workspace }}/build/EdgeSlicer_Windows_Installer_*.exe

      - name: Upload artifacts Win PDB
        if: inputs.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: PDB
          path: ${{ github.workspace }}/build/src/Release/Debug_PDB_${{ env.ver }}_for_developers_only.7z

      - name: Upload Snapmaker_Orca_profile_validator Win
        if: inputs.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSlicer_profile_validator_Windows_${{ env.ver }}
          path: ${{ github.workspace }}/build/src/Release/Snapmaker_Orca_profile_validator.exe

      - name: Deploy Windows release portable
        # See "Deploy Mac release" above: upstream's nightly release, skipped on this fork.
        if: github.repository == 'Snapmaker/OrcaSlicer' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') && inputs.os == 'windows-2022'
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/Snapmaker/OrcaSlicer/releases/169912305/assets{?name,label}
          release_id: 169912305
          asset_path: ${{ github.workspace }}/build/EdgeSlicer_Windows_${{ env.ver }}_portable.zip
          asset_name: EdgeSlicer_Windows_${{ env.ver }}_portable.zip
          asset_content_type: application/x-zip-compressed
          max_releases: 1

      - name: Deploy Windows release installer
        if: github.repository == 'Snapmaker/OrcaSlicer' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') && inputs.os == 'windows-2022'
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/Snapmaker/OrcaSlicer/releases/169912305/assets{?name,label}
          release_id: 169912305
          asset_path: ${{ github.workspace }}/build/EdgeSlicer_Windows_Installer_${{ env.ver }}.exe
          asset_name: EdgeSlicer_Windows_Installer_${{ env.ver }}.exe
          asset_content_type: application/x-msdownload
          max_releases: 1

      - name: Deploy Windows Snapmaker_Orca_profile_validator release
        if: github.repository == 'Snapmaker/OrcaSlicer' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') && inputs.os == 'windows-2022'
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/Snapmaker/OrcaSlicer/releases/169912305/assets{?name,label}
          release_id: 169912305
          asset_path: ${{ github.workspace }}/build/src/Release/Snapmaker_Orca_profile_validator.exe
          asset_name: EdgeSlicer_profile_validator_Windows_nightly.exe
          asset_content_type: application/x-msdownload
          max_releases: 1

# Ubuntu
      - name: Install dependencies
        if: inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04'
        env:
          apt-cmd: ${{ (inputs.os == 'ubuntu-20.04' && 'apt-fast') || (inputs.os == 'ubuntu-24.04' && 'sudo apt-get') || '' }}
          webkit-ver: ${{ (inputs.os == 'ubuntu-20.04' && '4.0') || (inputs.os == 'ubuntu-24.04' && '4.1') || '' }}
          libfuse2-pkg: ${{ (inputs.os == 'ubuntu-20.04' && 'libfuse2') || (inputs.os == 'ubuntu-24.04' && 'libfuse2t64') || '' }}
        run: |
          ${{ env.apt-cmd }} update
          ${{ env.apt-cmd }} install -y autoconf build-essential cmake curl eglexternalplatform-dev \
          extra-cmake-modules file git libcairo2-dev libcurl4-openssl-dev libdbus-1-dev libglew-dev libglu1-mesa-dev \
          libglu1-mesa-dev libgstreamer1.0-dev libgstreamerd-3-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-good1.0-dev \
          libgtk-3-dev libgtk-3-dev libmspack-dev libsecret-1-dev libsoup2.4-dev libssl-dev libudev-dev libwayland-dev \
          libwebkit2gtk-${{ env.webkit-ver }}-dev libxkbcommon-dev locales locales-all m4 pkgconf sudo wayland-protocols wget ${{ env.libfuse2-pkg }}

      - name: Install dependencies from build_linux.sh
        if: inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04'
        shell: bash
        run: sudo ./build_linux.sh -ur

      - name: Fix permissions
        if: inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04'
        shell: bash
        run: sudo chown $USER -R ./

      - name: Build slicer
        if: inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04'
        shell: bash
        env:
          ubuntu-ver-str: ${{ (inputs.os == 'ubuntu-24.04' && '_Ubuntu2404') || '' }}
        run: |
          ./build_linux.sh -isr
          # The AppImage is named for SLIC3R_APP_KEY (src/dev-utils/platform/unix/build_appimage.sh.in),
          # which the rebrand changed from Snapmaker_Orca to EdgeSlicer.
          mv -n ./build/EdgeSlicer_Linux_V${{ env.ver_pure }}.AppImage ./build/EdgeSlicer_Linux_AppImage${{ env.ubuntu-ver-str }}_${{ env.ver }}.AppImage
          chmod +x ./build/EdgeSlicer_Linux_AppImage${{ env.ubuntu-ver-str }}_${{ env.ver }}.AppImage

      # The same guard the Windows pipeline has: a plug-in that was built must be in the package.
      - name: UltraNet - verify it is in the AppImage tree
        if: (inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04') && steps.ultranet.outputs.enabled == 'true'
        shell: bash
        run: |
          d=./build/package/bin/ultranet
          for f in libbambu_networking.so libBambuSource.so ultranet.txt; do
            [ -f "$d/$f" ] || { echo "::error::UltraNet was built but $f is missing from $d"; exit 1; }
          done
          echo "bundled: $(sed -n 2p "$d/ultranet.txt")"

      - name: Upload artifacts Ubuntu
        if: ${{ ! env.ACT && inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04' }}
        env:
          ubuntu-ver: ${{ (inputs.os == 'ubuntu-20.04' && '2004') || (inputs.os == 'ubuntu-24.04' && '2404') || '' }}
          ubuntu-ver-str: ${{ (inputs.os == 'ubuntu-24.04' && '_Ubuntu2404') || '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSlicer_Linux_ubuntu_${{ env.ubuntu-ver }}_${{ env.ver }}
          path: './build/EdgeSlicer_Linux_AppImage${{ env.ubuntu-ver-str }}_${{ env.ver }}.AppImage'

      - name: Upload Snapmaker_Orca_profile_validator Ubuntu
        if: ${{ ! env.ACT && inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04' }}
        env:
          ubuntu-ver: ${{ (inputs.os == 'ubuntu-20.04' && '2004') || (inputs.os == 'ubuntu-24.04' && '2404') || '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSlicer_profile_validator_Linux_ubuntu_${{ env.ubuntu-ver }}_${{ env.ver }}
          path: './build/src/Release/Snapmaker_Orca_profile_validator'

      - name: Deploy Ubuntu release
        # See "Deploy Mac release" above: upstream's nightly release, skipped on this fork.
        if: ${{ ! env.ACT && github.repository == 'Snapmaker/OrcaSlicer' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') && (inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04') }}
        env:
          ubuntu-ver-str: ${{ (inputs.os == 'ubuntu-24.04' && '_Ubuntu2404') || '' }}
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/Snapmaker/OrcaSlicer/releases/169912305/assets{?name,label}
          release_id: 169912305
          asset_path: ./build/EdgeSlicer_Linux_AppImage${{ env.ubuntu-ver-str }}_${{ env.ver }}.AppImage
          asset_name: EdgeSlicer_Linux_AppImage${{ env.ubuntu-ver-str }}_${{ env.ver }}_Beta.AppImage
          asset_content_type: application/octet-stream
          max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted
      - name: Deploy Ubuntu release
        # Pushes upstream's "nightly-builds" tag, which this fork's release process (versioned
        # v*-edge tags/releases) does not use - skip here rather than force-push an unrelated tag.
        if: ${{ ! env.ACT && github.repository == 'Snapmaker/OrcaSlicer' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') && inputs.os == 'ubuntu-24.04' }}
        uses: rickstaa/action-create-tag@v1
        with:
          tag: "nightly-builds"
          tag_exists_error: false
          force_push_tag: true
          message: "nightly-builds"

      - name: Deploy Ubuntu Snapmaker_Orca_profile_validator release
        if: ${{ ! env.ACT && github.repository == 'Snapmaker/OrcaSlicer' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/2.3.0-final') && (inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04') }}
        env:
          ubuntu-ver-str: ${{ (inputs.os == 'ubuntu-24.04' && '_Ubuntu2404') || '' }}
        uses: WebFreak001/deploy-nightly@v3.2.0
        with:
          upload_url: https://uploads.github.com/repos/Snapmaker/OrcaSlicer/releases/169912305/assets{?name,label}
          release_id: 169912305
          asset_path: ./build/src/Release/Snapmaker_Orca_profile_validator
          asset_name: EdgeSlicer_profile_validator_Linux${{ env.ubuntu-ver-str }}_nightly
          asset_content_type: application/octet-stream
          max_releases: 1

